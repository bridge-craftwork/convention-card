<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found: convention card</title>
<!--
  Cloudflare Pages serves this file, with a 404 status, for any path that
  matches no file. Without it Pages answers every path with index.html and
  200, and a client cannot tell a missing page from a real one. The real
  routes are files: index.html (/), reference.txt, llms.txt and assets/.
  The editor's own state is in the fragment (#import=…), never the path.
-->
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
         max-width: 34rem; margin: 18vh auto 0; padding: 0 1.5rem; line-height: 1.6; color: #1a1a1a }
  h1 { font-size: 1.25rem; font-weight: 500; margin: 0 0 .5rem }
  p { color: #6b7280; margin: 0 0 1rem }
  a { color: #334155 }
  ul { color: #6b7280; padding-left: 1.1rem }
</style>
</head>
<body>
  <h1>Not found</h1>
  <p>There is no page at that address.</p>
  <ul>
    <li><a href="/" id="home">The convention card editor</a></li>
    <li><a href="/reference.txt" id="ref">Card reference</a> (plain text)</li>
  </ul>
  <script>
    // A 404 can be at any depth, so point the links at the tool's root:
    // /card/ behind the site's router, / on its own domain.
    var root = /^\/card\//.test(location.pathname) ? '/card/' : '/'
    document.getElementById('home').href = root
    document.getElementById('ref').href = root + 'reference.txt'
  </script>
</body>
</html>
