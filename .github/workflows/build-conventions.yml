name: Build conventions.json

# spec/conventions/<category>/<name>.toml is the source, one file per
# convention; spec/conventions.json combines them for readers that cannot list
# a directory (the JS library in a browser, lesson-studio). Regenerates whenever
# the source changes, as Practice-Bidding-Scenarios does for its manifest.

on:
  push:
    branches: [main]
    paths:
      - 'spec/conventions/**'
      - 'scripts/build_conventions.py'
      - '.github/workflows/build-conventions.yml'
  workflow_dispatch:

# GITHUB_TOKEN pushes do not re-trigger workflows, and spec/conventions.json is
# outside the push paths above, so the commit-back below cannot cause a loop.
permissions:
  contents: write

concurrency:
  group: build-conventions
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate conventions.json
        run: python3 scripts/build_conventions.py

      - name: Commit conventions.json if changed
        run: |
          if [ -z "$(git status --porcelain spec/conventions.json)" ]; then
            echo "conventions.json unchanged — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add spec/conventions.json
          git commit -m "conventions.json: rebuild from spec/conventions (${GITHUB_SHA::7}) [skip ci]"
          git push
