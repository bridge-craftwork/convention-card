name: Test

# The spec and the Rust crate: the crate's tests load and check every spec
# file (fields, the .bbsa map, one file per convention). On pull requests the
# generator also runs, to catch a convention file that does not parse or whose
# id does not match its path. A PR need not update the generated files:
# build-conventions.yml regenerates it after the merge.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  conventions-json:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Every convention file parses and its id matches its path
        run: python3 scripts/build_conventions.py >/dev/null && git checkout -- spec/conventions.json spec/taxonomy.json
