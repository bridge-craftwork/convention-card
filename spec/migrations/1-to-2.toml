# Card schema 1.x → 2.0: a convention is a group with a `play` switch
# (docs/adr/0002-conventions-are-groups.md).
#
# A card records its `schema_version` at the top of card_data. A card whose
# version is missing or 1.x is upgraded by this file once, when it is read
# from any source (Bridge Classroom's database, a .json file, the card
# embedded in an exported PDF), and says "2.0" from then on. The file is
# permanent: it is how cards and PDFs already in people's hands keep loading.
# Readers: js/migrate.js (through spec/migrations/1-to-2.json, which
# scripts/build_spec.py generates) and the bridge-card crate's migrate.rs.
#
# Paths are full dotted paths into the nested card_data. Every rule reads the
# 1.x card as it was given (no rule sees another's output); [rename],
# [[split]] and [[select]] take the values they read off the card, and every
# rule writes its results. A write never replaces a
# value already there, whether the card had it or an earlier rule wrote it:
# the first writer wins, in the order of this file. Only leaves move (a
# value that is not an object), so a rule whose old path holds an object
# (a 2.0 group of the same name) leaves it alone, and upgrading a card that
# is already in 2.0 paths changes nothing. Objects left empty by a move are
# removed. Everything else on the card stays as it was.
#
# from, to      the versions this file upgrades: any 1.x (missing counts as
#               1.0) to `to`, which the upgraded card records.
#
# [rename]      "old path" = "new path": the value moves as it is. The old
#               paths include the older spellings the 1.x vocabulary read as
#               aliases of a renamed field (`three_nt.one_suit`), each after
#               the field's own 1.x path, so the field's own value wins.
#
# [[split]]     an enum that becomes a convention's switch and its style:
#                 from   the 1.x enum (a text value; anything else is left)
#                 play   the 2.0 switch: false when the value is `off`,
#                        else true
#                 style  the 2.0 enum, given the value unless it is `off`
#                 off    the option that meant "not played"
#
# [[select]]    yes/no boxes, alternatives, that become a convention's switch
#               and its style:
#                 play     the 2.0 switch: true when any box is on, false
#                          when the card has some of them and none is on.
#                          Optional: an agreement that is no convention (the
#                          king ask) has only the style
#                 style    the 2.0 enum: the option of the first box on
#                 off      the style written when the card has some of the
#                          boxes and none is on (optional)
#                 options  [{ box = "1.x path", value = "style option" }],
#                          in order; every box listed is taken off the card
#
# [[any]]       a switch turned on by any of some 1.x boxes:
#                 set    the 2.0 switch, written true when any of `from` is on
#                        (and nothing else wrote it); never written false
#                 from   1.x paths, only looked at (a rename may move them)

from = "1"
to = "2.0"

[rename]
# notrump: Jacoby transfers
"notrump.transfers.jacoby"                 = "notrump.jacoby_transfers.play"
"notrump.transfers.super_accept"           = "notrump.jacoby_transfers.super_accept"
"notrump.transfers.super_accept_doubleton" = "notrump.jacoby_transfers.super_accept_doubleton"
"notrump.transfers.vs_double"              = "notrump.jacoby_transfers.vs_double"
"notrump.transfers.vs_2c"                  = "notrump.jacoby_transfers.vs_2c"
"notrump.two_nt.transfers_3level"          = "notrump.jacoby_transfers.over_2nt"
# notrump: Texas
"notrump.transfers.texas"                  = "notrump.texas.play"
"notrump.transfers.texas_2_under"          = "notrump.texas.two_under"
"notrump.transfers.texas_4c"               = "notrump.texas.bid_4c"
"notrump.transfers.texas_4d"               = "notrump.texas.bid_4d"
"notrump.transfers.texas_4h"               = "notrump.texas.bid_4h"
"notrump.transfers.texas_4s"               = "notrump.texas.bid_4s"
"notrump.two_nt.transfers_4level"          = "notrump.texas.over_2nt"
# notrump: minor-suit transfers (the switch: [[split]] and [[any]] below)
"notrump.transfers.spades_relay"           = "notrump.minor_transfers.two_s"
"notrump.transfers.two_s_clubs"            = "notrump.minor_transfers.two_s_clubs"
"notrump.transfers.two_nt"                 = "notrump.minor_transfers.two_nt"
"notrump.transfers.two_nt_clubs"           = "notrump.minor_transfers.two_nt_clubs"
"notrump.transfers.two_nt_diamonds"        = "notrump.minor_transfers.two_nt_diamonds"
"notrump.transfers.three_c_diamonds"       = "notrump.minor_transfers.three_c_diamonds"
"notrump.two_nt.minor_transfers"           = "notrump.minor_transfers.over_2nt"
"notrump.two_nt.transfer_3s_clubs"         = "notrump.minor_transfers.over_2nt_3s_clubs"
"notrump.two_nt.transfer_4c_diamonds"      = "notrump.minor_transfers.over_2nt_4c_diamonds"
# notrump: Stayman and Minor Suit Stayman over 2NT
"notrump.two_nt.puppet"                    = "notrump.stayman.puppet_2nt"
"notrump.two_nt.three_c_3nt_both_majors"   = "notrump.stayman.over_2nt_both_majors"
"notrump.two_nt.minor_stayman"             = "notrump.minor_suit_stayman.over_2nt"
# notrump: Lebensohl, Rubensohl, Gambling 3NT
"notrump.lebensohl.over_interference"      = "notrump.lebensohl.play"
"notrump.rubensohl.over_interference"      = "notrump.rubensohl.play"
"notrump.three_nt.one_suit"                = "notrump.gambling_3nt.play"
"three_nt.one_suit"                        = "notrump.gambling_3nt.play"
"notrump.three_nt.one_suit_desc"           = "notrump.gambling_3nt.description"
"three_nt.one_suit_desc"                   = "notrump.gambling_3nt.description"
# major openings
"major_openings.two_over_one.game_force"   = "major_openings.two_over_one.play"
# two-level openings
"two_level.two_clubs.kokish"               = "two_level.kokish.play"
"two_level.two_clubs.parrish_bust"         = "two_level.parrish_bust.play"
"two_level.two_diamonds.multi"             = "two_level.multi.play"
"two_level.two_diamonds.multi_strong"      = "two_level.multi.strong_option"
"two_level.two_diamonds.mini_roman"        = "two_level.mini_roman.play"
"two_level.two_diamonds.mini_roman_maxi"   = "two_level.mini_roman.maxi"
"two_level.two_diamonds.reverse_flannery"  = "two_level.reverse_flannery.two_d"
# slam: Blackwood and RKCB (RKCB's switch: [[select]] below)
"slam.blackwood.standard"                  = "slam.blackwood.play"
"other_conventions.blackwood.standard"     = "slam.blackwood.play"
"slam.blackwood.minor_0314"                = "slam.rkcb.minor_0314"
"slam.blackwood.queen_ask"                 = "slam.rkcb.queen_ask"
"other_conventions.blackwood.queen_ask"    = "slam.rkcb.queen_ask"
# general
"general.jump_shifts.soloway"              = "general.soloway.play"
"general.jump_shifts.soloway_extended"     = "general.soloway.extended"

# Minor-suit responses to 1NT: the enum becomes the switch and its style.
[[split]]
from  = "notrump.minor_transfers"
play  = "notrump.minor_transfers.play"
style = "notrump.minor_transfers.style"
off   = "none"

# A 1.x card with no enum plays minor-suit transfers when any of their boxes
# is on.
[[any]]
set  = "notrump.minor_transfers.play"
from = [
  "notrump.transfers.spades_relay",
  "notrump.transfers.two_s_clubs",
  "notrump.transfers.two_nt",
  "notrump.transfers.two_nt_clubs",
  "notrump.transfers.two_nt_diamonds",
  "notrump.transfers.three_c_diamonds",
  "notrump.two_nt.minor_transfers",
  "notrump.two_nt.transfer_3s_clubs",
  "notrump.two_nt.transfer_4c_diamonds",
]

# RKCB 1430 or 0314: one switch, and which version.
[[select]]
play  = "slam.rkcb.play"
style = "slam.rkcb.style"
options = [
  { box = "slam.blackwood.rkcb_1430", value = "1430" },
  { box = "other_conventions.blackwood.rkcb_1430", value = "1430" },
  { box = "slam.blackwood.rkcb_0314", value = "0314" },
  { box = "other_conventions.blackwood.rkcb_0314", value = "0314" },
]

# The king ask: two alternative boxes become one choice (#72)
[[select]]
style = "slam.king_ask.style"
off = "none"
options = [
  { box = "slam.king_ask.five_nt", value = "five_nt" },
  { box = "slam.king_ask.next_step", value = "next_step" },
]

# Reverse Flannery is played when any of its openings is.
[[any]]
set  = "two_level.reverse_flannery.play"
from = [
  "two_level.two_diamonds.reverse_flannery",
  "two_level.reverse_flannery.two_h",
  "two_level.reverse_flannery.two_s",
]
