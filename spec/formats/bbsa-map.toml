# Mapping from BBA `.bbsa` keys to convention card fields.
#
# Forms:
#   "Key" = "path"
#       On/off toggle for a bool field: 1 => true, 0 => false.
#       Export writes 1 when the field is true.
#   "Key" = { set = { "path" = value, ... } }
#       One member of a one-of group: when the key is 1, set these values;
#       when 0, set nothing. Export writes 1 when all the values hold.
#   "Key" = { index = "path", values = [...] }
#       Integer key selecting an enum value by position.
#
# Keys not listed here are kept verbatim in the card (`bba_passthrough`) and
# written back unchanged on export, so a .bbsa round trip is lossless. They
# are listed there because their meaning needs a bridge decision before they
# get a card field; see `rbb card import-bbsa` output.
#
# "Not defined" lines are layout padding and are ignored.

"System type" = { index = "general.system_category", values = ["two_over_one", "sayc", "polish_club", "precision", "acol"] }

