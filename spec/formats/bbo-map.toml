# Mapping from BBO's ACBL convention card to card fields, read both ways by
# js/bbo.js. The file is the JSON the Better BBO Convention Card extension
# reads and writes (`source = "bbo-acbl"`): per card, `fields` (BBO's text
# slots, the `E_` elements), `conventions` (its checkboxes, `C_`, each "y"
# when ticked) and `leads` (the lead circles, `L_`).
#
# [conventions] — the checkboxes:
#   "key" = "path"
#       Ticked: the yes/no field is true. Export ticks it when the field is true.
#   "key" = { set = { "path" = value, ... } }
#       Ticked: these values. Export ticks it when they all hold.
#
# [fields] — the text slots:
#   "key" = "path"
#       Text, with suit shorthand (!S, 4H) read as ♠♥♦♣; export writes !S !H !D !C.
#   "key" = { range = "path" }
#       The leading number ("14+" → 14). A + or - after it goes to
#       `<path>_plus` / `<path>_minus` where the spec has those fields.
#   "key" = { plain = "path" }
#       Text kept as typed, without suit symbols.
#   "key" = { text = "path", also = { "path" = value } }
#       Text; when the slot is filled, these values too.
#
# [[joined]] — several slots, one line each, in one field. Export fills the
# slots in order, and a last slot takes the remaining lines joined by "; ".
# `export = false`: a copy of slots other entries carry; export ignores it.
#
# Two things are rules in js/bbo.js rather than entries here: the `leads`
# circles (`ls-akx-a`: vs suits, the pattern AKx, the A; `ls-xx-x1`: the
# first x), and the 2♣ write-in lines `2COther1`–`2COther6` (two columns of
# three slots onto the card's four lines). The title and `names` slot are the
# card's name and `metadata.partner_names`.
#
# Export starts from the BBO card kept in the card (`_bbo_raw`), so slots and
# boxes this map does not cover go back as they came, and a slot keeps its
# text unless its fields have changed since the import.

[conventions]
# Slam / Blackwood
"1430"      = "other_conventions.blackwood.rkcb_1430"
"rkc"       = "other_conventions.blackwood.rkcb_0314"
"blackwood" = "other_conventions.blackwood.standard"
"gerber"    = "other_conventions.gerber.play"
"dopi"      = "slam.dopi"
"depo"      = "slam.depo"
"ropi"      = "slam.ropi"
# General / forcing openings
"2over1GF" = "major_openings.two_over_one.game_force"
"F1C"      = "general.forcing_opening_1c"
"F2C"      = "general.forcing_opening_2c"
# Major openings
"major12-4"      = { set = { "major_openings.min_length_1st_2nd" = 4 } }
"major12-5"      = { set = { "major_openings.min_length_1st_2nd" = 5 } }
"major34-4"      = { set = { "major_openings.min_length_3rd_4th" = 4 } }
"major34-5"      = { set = { "major_openings.min_length_3rd_4th" = 5 } }
"major2RaiseW"   = "major_openings.jump_raise.weak"
"major2RaiseI"   = "major_openings.jump_raise.inv"
"majorO2RaiseW"  = "major_openings.jump_raise_after_overcall.weak"
"majorO2RaiseI"  = "major_openings.jump_raise_after_overcall.inv"
"major2NTRaise"  = "major_openings.jacoby_2nt.play"
"major3NTRaise"  = "major_openings.three_nt_raise.play"
"majorSplinter"  = "major_openings.splinters.play"
"major1NTF"      = "major_openings.one_nt_response.forcing"
"major1NTSF"     = "major_openings.one_nt_response.semi_forcing"
"drury"          = "major_openings.drury.play"
"druryRev"       = { set = { "major_openings.drury.play" = true, "major_openings.drury.reverse" = true } }
"drury2W"        = { set = { "major_openings.drury.play" = true, "major_openings.drury.two_way" = true } }
# Minor openings
"minorC3"          = { set = { "minor_openings.one_club.min_length" = 3 } }
"minorC4"          = { set = { "minor_openings.one_club.min_length" = 4 } }
"minorC5"          = { set = { "minor_openings.one_club.min_length" = 5 } }
"minorD3"          = { set = { "minor_openings.one_diamond.min_length" = 3 } }
"minorD4"          = { set = { "minor_openings.one_diamond.min_length" = 4 } }
"minorD5"          = { set = { "minor_openings.one_diamond.min_length" = 5 } }
"minor2RaiseW"     = "minor_openings.one_club.jump_raise.weak"
"minor2RaiseI"     = "minor_openings.one_club.jump_raise.inv"
"minorO2RaiseW"    = "minor_openings.one_club.jump_raise_after_overcall.weak"
"minorO2RaiseI"    = "minor_openings.one_club.jump_raise_after_overcall.inv"
"minorSingleRaise" = "minor_openings.one_club.single_raise.nf"
"minorInvForcing"  = "minor_openings.inverted_minors.play"
"bypassDs"         = "minor_openings.bypass_5_plus"
# 2♣ and weak twos
"2CStrong"     = { set = { "two_level.two_clubs.meaning" = "strong" } }
"2CVeryStrong" = { set = { "two_level.two_clubs.meaning" = "very_strong" } }
"2DWaiting"    = { set = { "two_level.two_clubs.2d_response" = "waiting" } }
"2DNeg"        = { set = { "two_level.two_clubs.2d_response" = "negative" } }
"2DWeak"       = { set = { "two_level.two_diamonds.meaning" = "weak" } }
"2HWeak"       = { set = { "two_level.two_hearts.meaning" = "weak" } }
"2SWeak"       = { set = { "two_level.two_spades.meaning" = "weak" } }
"2D2NT"        = "two_level.two_diamonds.two_nt_force"
"2H2NT"        = "two_level.two_hearts.two_nt_force"
"2S2NT"        = "two_level.two_spades.two_nt_force"
"2DNew"        = "two_level.two_diamonds.new_suit_nf"
"2HNew"        = "two_level.two_hearts.new_suit_nf"
"2SNew"        = "two_level.two_spades.new_suit_nf"
# Other conventional calls
"WJS"     = "other_conventions.weak_jump_shifts_not_in_comp"
"WJSComp" = "other_conventions.weak_jump_shifts_in_comp"
"FSF1"    = "other_conventions.fourth_suit_forcing.one_round"
"FSFG"    = "other_conventions.fourth_suit_forcing.game_force"
"NMF"     = "other_conventions.new_minor_forcing.play"
"NMF2"    = "other_conventions.two_way_nmf"
# 1NT: BBO has a box for each Jacoby transfer; the card has one field.
"1N5M"      = { set = { "notrump.one_nt.five_card_major" = "sometimes" } }
"1NStayman" = "notrump.stayman.forcing"
"1NPuppet"  = "notrump.stayman.puppet"
"1N2DTrans" = "notrump.transfers.jacoby"
"1N2HTrans" = "notrump.transfers.jacoby"
"1NTexas"   = "notrump.transfers.texas"
"1NSmolen"  = "notrump.smolen.play"
"1NLeb"     = "notrump.lebensohl.over_interference"
"1NNeg"     = "notrump.dbl.negative"
# 2NT
"2NPuppet" = "notrump.two_nt.puppet"
"2NJacoby" = "notrump.two_nt.transfers_3level"
"2NTexas"  = "notrump.two_nt.transfers_4level"
# Special doubles
"dblNegative"   = "doubles.negative.play"
"dblResponsive" = "doubles.responsive.play"
"dblMaximal"    = "doubles.maximal"
"dblSupport"    = "doubles.support.play"
"rdblSupport"   = "doubles.support.rdbl"
# Overcalls
"ocallNSF" = { set = { "overcalls.responses.new_suit" = "forcing" } }
"ocallNSC" = { set = { "overcalls.responses.new_suit" = "nf_constructive" } }
"ocallJRW" = { set = { "overcalls.responses.jump_raise" = "weak" } }
"jOcallW"  = { set = { "overcalls.jump" = "weak" } }
"jOcallI"  = { set = { "overcalls.jump" = "intermediate" } }
"jOcallS"  = { set = { "overcalls.jump" = "strong" } }
# Preempts
"preS"  = { set = { "preempts.three_level_style" = "sound" } }
"preL"  = { set = { "preempts.three_level_style" = "light" } }
"preVL" = { set = { "preempts.three_level_style" = "very_light" } }
# Direct cuebids (Michaels)
"cueMinorM" = "direct_cuebids.nat_minors_michaels"
"cueMajorM" = "direct_cuebids.nat_majors_michaels"
# NT overcalls
"systemOn"       = "nt_overcalls.direct.systems_on"
"systemOnB"      = "nt_overcalls.balance.systems_on"
"2NTOcallLowest" = "nt_overcalls.jump_2nt_lowest_unbid"
# Vs takeout double
"vsTONSF1"     = "vs_to_double.new_suit_forcing_1lvl"
"vsTONSF2"     = "vs_to_double.new_suit_forcing_2lvl"
"vsTORdbl"     = "vs_to_double.redouble.ten_plus"
"vsTOMajorsLP" = "vs_to_double.two_nt_raise_majors.limit_plus"
"vsTOMinorsLP" = "vs_to_double.two_nt_raise_minors.limit_plus"
# Vs preempts
"vsPreTO"  = "vs_preempts.takeout_double"
"vsPreLeb" = "vs_preempts.lebensohl_response"
# Leads and carding
"4thSuits"   = "leads.vs_suits.length.fourth_best"
"4thNT"      = "leads.vs_nt.length.fourth_best"
"primaryA"   = "carding.partner_lead.attitude"
"primaryC"   = "carding.partner_lead.count"
"primarySP"  = "carding.partner_lead.suit_preference"
"UDCSuits"   = "carding.suits.upside_down_count"
"UDCNT"      = "carding.nt.upside_down_count"
"UDASuits"   = "carding.suits.upside_down_attitude"
"UDANT"      = "carding.nt.upside_down_attitude"
"smithSuits" = "carding.smith_echo_suits"
"smithNT"    = "carding.smith_echo_nt"
"trumpSP"    = { set = { "carding.trump_signals" = "Suit Preference" } }

[fields]
"approach" = "general.system"
# 1NT opening
"1NTMin1"     = { range = "notrump.one_nt.range_min" }
"1NTMax1"     = { range = "notrump.one_nt.range_max" }
"1NTMin2"     = { range = "notrump.one_nt_alt.range_min" }
"1NTMax2"     = { range = "notrump.one_nt_alt.range_max" }
"1NSysOn"     = "notrump.one_nt.sys_on_vs"
"1N2S"        = "notrump.responses.2s_other"
"1N2N"        = "notrump.responses.2nt_other"
"1N3C"        = "notrump.responses.3c"
"1N3D"        = "notrump.responses.3d"
"1N3H"        = "notrump.responses.3h"
"1N3S"        = "notrump.responses.3s"
"1NLebDenies" = "notrump.lebensohl.description"
"1NNegOther"  = "notrump.dbl.negative_desc"
# 2NT and 3NT openings
"2NTMin"  = { range = "notrump.two_nt.range_min" }
"2NTMax"  = { range = "notrump.two_nt.range_max" }
"2N3S"    = "notrump.two_nt.three_s_desc"
"3NOther" = { text = "three_nt.one_suit_desc", also = { "three_nt.one_suit" = true } }
# Major openings
"major3NTMin" = { range = "major_openings.three_nt_raise.range_min" }
"major3NTMax" = { range = "major_openings.three_nt_raise.range_max" }
# Minor openings (the 1♣ range columns)
"minor1NTMin" = { range = "minor_openings.one_club.one_nt_range_min" }
"minor1NTMax" = { range = "minor_openings.one_club.one_nt_range_max" }
"minor2NTMin" = { range = "minor_openings.one_club.two_nt_range_min" }
"minor2NTMax" = { range = "minor_openings.one_club.two_nt_range_max" }
"minor3NTMin" = { range = "minor_openings.one_club.three_nt_range_min" }
"minor3NTMax" = { range = "minor_openings.one_club.three_nt_range_max" }
# 2♣ and weak twos
"2CMin"   = { plain = "two_level.two_clubs.min_hcp_str" }
"2CMax"   = { plain = "two_level.two_clubs.max_hcp" }
"2DMin"   = { range = "two_level.two_diamonds.min_hcp" }
"2DMax"   = { range = "two_level.two_diamonds.max_hcp" }
"2DOther1" = "two_level.two_diamonds.description"
"2DOther2" = "two_level.two_diamonds.notes"
"2HMin"   = { range = "two_level.two_hearts.min_hcp" }
"2HMax"   = { range = "two_level.two_hearts.max_hcp" }
"2HOther1" = "two_level.two_hearts.description"
"2HOther2" = "two_level.two_hearts.notes"
"2SMin"   = { range = "two_level.two_spades.min_hcp" }
"2SMax"   = { range = "two_level.two_spades.max_hcp" }
"2SOther1" = "two_level.two_spades.description"
"2SOther2" = "two_level.two_spades.notes"
# Overcalls
"ocallMin"  = { range = "overcalls.one_level_min" }
"ocallMax"  = { range = "overcalls.one_level_max" }
"ocallOther" = "overcalls.notes"
# NT overcalls: Direct and Balance each have a Conv. line.
"1NOcallDMin"   = { range = "nt_overcalls.direct.range_min" }
"1NOcallDMax"   = { range = "nt_overcalls.direct.range_max" }
"1NOcallBMin"   = { range = "nt_overcalls.balance.range_min" }
"1NOcallBMax"   = { range = "nt_overcalls.balance.range_max" }
"1NOcallOther1" = "nt_overcalls.direct.conv_text"
"1NOcallOther2" = "nt_overcalls.balance.conv_text"
# Defense vs 1NT: column 1 vs strong, column 2 vs weak.
"vs1NTHead1" = "competitive.vs_1nt_strong.system"
"vs1NT2C1"   = "competitive.vs_1nt_strong.2c"
"vs1NT2D1"   = "competitive.vs_1nt_strong.2d"
"vs1NT2H1"   = "competitive.vs_1nt_strong.2h"
"vs1NT2S1"   = "competitive.vs_1nt_strong.2s"
"vs1NT2N1"   = "competitive.vs_1nt_strong.2nt"
"vs1NTDbl1"  = "competitive.vs_1nt_strong.dbl"
"vs1NTHead2" = "competitive.vs_1nt_weak.system"
"vs1NT2C2"   = "competitive.vs_1nt_weak.2c"
"vs1NT2D2"   = "competitive.vs_1nt_weak.2d"
"vs1NT2H2"   = "competitive.vs_1nt_weak.2h"
"vs1NT2S2"   = "competitive.vs_1nt_weak.2s"
"vs1NT2N2"   = "competitive.vs_1nt_weak.2nt"
"vs1NTDbl2"  = "competitive.vs_1nt_weak.dbl"
# Special doubles: dblOther2–4 are the "thru" levels.
"dblOther2" = "doubles.negative.through"
"dblOther3" = "doubles.responsive.through"
"dblOther4" = "doubles.support.through"
# Vs preempts, slam
"vsPreTOThru" = "vs_preempts.takeout_double_thru"
"slamLevel"   = "slam.trump_level"
"slamOther1"  = "slam.control_bids"
"slamOther2"  = "slam.vs_interference"
# Single "Other" lines
"cueOther"     = "direct_cuebids.description"
"vsTOOther"    = "vs_to_double.notes"
"discardOther" = "carding.notes"
# OTHER CONV. CALLS, top to bottom: after New Minor Forcing, after Weak Jump
# Shifts, after 4th Suit Forcing, then the two catch-all lines.
"other1" = "other_conventions.nmf_notes"
"other2" = "other_conventions.weak_jump_shifts_notes"
"other3" = "other_conventions.fourth_suit_forcing.notes"
"other4" = "other_conventions.notes_line_1"
"other5" = "other_conventions.notes_line_2"

[[joined]]
path = "notes.notrump_notes"
keys = ["1NOther1", "1NOther2", "1NOther3", "2NOther", "CNTOther1"]

[[joined]]
path = "notes.major_notes"
keys = ["majorOther1", "majorOther2"]

[[joined]]
path = "notes.minor_notes"
keys = ["minorOther1", "minorOther2"]

[[joined]]
path = "competitive.notes"
keys = ["vs1NTOther1", "vs1NTOther2"]

[[joined]]
path = "doubles.notes"
keys = ["dblOther5", "dblOther6"]

# The New card has one Conv. line for NT overcalls: both lines, joined.
[[joined]]
path = "nt_overcalls.notes"
keys = ["1NOcallOther1", "1NOcallOther2"]
export = false
