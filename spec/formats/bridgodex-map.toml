# Mapping from a Bridgodex.com card (its JSON export and import) to card
# fields, read both ways by js/bridgodex.js. Bridgodex keeps a card's boxes
# in blocks (`settings.majors.drury_2c`); each table here is one block, and
# each key one of its boxes. A ticked box is "on".
#
# The blocks and keys are Bridgodex's own, as its site lists them (checked
# 2026-10-06 against the card layout its page carries, and against a card
# loaded through its import). A box listed nowhere here has no card field
# (the natural-response ticks over 1NT, say): it stays in the card's
# Bridgodex data (`_bridgeodex_raw`) and goes back on export.
#
# Entries:
#   "key" = "path"
#       A tick: on sets the yes/no field. Export ticks it when the field is true.
#   "key" = { set = { "path" = value, ... } }
#       A tick for these values. Export ticks it when they all hold, or,
#       with `when_any = { ... }`, when any of those holds.
#   "key" = { text = "path" }
#       Text, with suit shorthand (!S, 4H) read as ♠♥♦♣; export writes !S !H !D !C.
#       `unless_same_as = "key"`: not read when it repeats that box.
#   "key" = { plain = "path" }    Text kept as typed.
#   "key" = { number = "path" }   A number; anything else is not read.
#   "key" = { range = "path" }
#       A range end ("14+"): the number, and a + or - after it to
#       `<path>_plus` / `<path>_minus` where the spec has them. With
#       `words = "path"`, words typed after the number ("17 Vul") go to that
#       field (the min's, then the max's); `words_export = true` writes them
#       back after this end.
#   `export = false` on any entry: read but not written (one of two boxes
#   that mean the same to the card).
#
# [[any]]: a field set when any of the boxes is ticked (Texas from its
# suits). The boxes carry it, so export writes nothing, unless the field is
# set and none of them is ticked: then it ticks the `export` boxes.
#
# [[notes]]: the card's notes, made from Bridgodex's text boxes with a label
# each, so the editor shows them, including the boxes no field holds. The
# export writes boxes from their own fields; a note's lines that those would
# not give back (typed in the editor) go in its `export_to` box, so none is
# lost.
#
# Rules in js/bridgodex.js rather than here: the lead circles
# (`length_leads_Hxx`, `honor_leads_AKx`, `honor_interior_seq_KT9x`, each a
# position), the names (`names.names`), the file's own `notes`, and 2/1 game
# force read from the general approach's words.

