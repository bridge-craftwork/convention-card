[[any]]
path = "notrump.transfers.texas"
keys = ["1_no_trump.tfr_4c", "1_no_trump.tfr_4d", "1_no_trump.tfr_4h"]
# Texas on its own is 4♦ and 4♥, the transfers to the majors.
export = ["1_no_trump.tfr_4d", "1_no_trump.tfr_4h"]

[[any]]
path = "other_conventions.gerber.play"
keys = ["slams.gerber_directly_over_nt", "slams.gerber_over_nt_seq", "slams.gerber_over_non_nt_seq"]
export = ["slams.gerber_directly_over_nt"]

# The two "Other" rows as one note, for the editor's single text box.
[[notes]]
path = "other_conventions.notes"
export_to = "other.more2"
lines = [{ key = "other.more1" }, { key = "other.more2" }]

