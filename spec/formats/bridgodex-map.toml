[[any]]
path = "notrump.transfers.texas"
keys = ["1_no_trump.tfr_4c", "1_no_trump.tfr_4d", "1_no_trump.tfr_4h", "1_no_trump.tfr_4s"]
# Texas on its own is the majors' (the spec's level-4 pair).
export = ["1_no_trump.tfr_4h", "1_no_trump.tfr_4s"]

[[any]]
path = "other_conventions.gerber.play"
keys = ["slams.gerber_directly_over_nt", "slams.gerber_over_nt_seq", "slams.gerber_non_nt_seq"]
export = ["slams.gerber_directly_over_nt"]

# The two "Other" rows as one note, for the editor's single text box.
[[notes]]
path = "other_conventions.notes"
export_to = "other.more2"
lines = [{ key = "other.more1" }, { key = "other.more2" }]

[[notes]]
path = "notes.notrump_notes"
export_to = "1_no_trump.more"
lines = [{ key = "1_no_trump.more" }, { key = "2_no_trump.other", label = "2NT: " }]

[[notes]]
path = "notes.major_notes"
export_to = "majors.more"
lines = [
  { key = "majors.art_raises_other", label = "Artificial raises: " },
  { key = "majors.drury_other", label = "Drury: " },
  { key = "majors.more", unless_same_as = "majors.other" },
  { key = "majors.other" },
]

[[notes]]
path = "notes.minor_notes"
export_to = "minors.1c_more"
lines = [
  { key = ["minors.1c_more", "minors.1c_1d"], label = "1♣ responses: " },
  { key = "minors.1c", label = "1♣: " },
  { key = "minors.1d", label = "1♦: " },
]

