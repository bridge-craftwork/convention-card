# Boxes no card field holds. They stay in the card's Swan data
# (`_swan_raw`) and go back on export; a card from elsewhere gets them
# blank. Each is "tick" (true/false) or "text".
[left_out]
"General.name.acbl_number" = "text"
"General.name.names" = "text"   # the card's names: js/swan.js
# 2♦ Forcing Stayman (two-way Stayman): no field yet.
"Notrump_opening.One_notrump_opening.two_diamonds.forcing_stayman" = "tick"
# 1m: jump shift in the other minor as the forcing raise (criss-cross): no field yet.
"Minor_opening.responses.forcing_raise.js_in_other_minor" = "tick"
# A forcing jump raise of an overcall: the card's jump-raise field has no "forcing".
"Simple_overcall.responses.jump_raise_is.forcing" = "tick"
