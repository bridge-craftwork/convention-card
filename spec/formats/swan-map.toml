# Mapping from a BridgeWinners card in its "Swan" JSON (the file its card
# editor exports, and imports: Bridge Winners' "Import from Swan") to card
# fields, read both ways by js/swan.js.
#
# A Swan file is one object, `{ "Convention_Card": { … } }`, nested by the
# sections of the ACBL Classic card: `General.forcing_openings.one_club`.
# Each table here is one of those sections, and each key the rest of a box's
# path inside it. A tick is true or false; every other box is a string ("" when
# empty), ranges included ("14+"). Suits are typed !C !D !H !S (or lower case).
#
# The sections and keys are BridgeWinners' own, from two of its exports
# (2026-11-21: a blank card, and its "Bridge Winners Standard" template).
# Every key of the format is listed here, as an entry, a lead holding, or in
# [left_out], so js/swan.js can write a whole file: BridgeWinners' import is
# given every box, as its own export writes them.
#
# Entries (as in bridgodex-map.toml):
#   "key" = "path"
#       A tick: true sets the yes/no field. Export ticks it when the field is true.
#   "key" = { set = { "path" = value, ... } }
#       A tick for these values. Export ticks it when they all hold, or,
#       with `when_any = { ... }`, when any of those holds (a list: any of
#       its values).
#   "key" = { filled = "path" }
#       A tick that says a line beside it is filled in ("Other" before its
#       line). Not read (the line carries it); export ticks it when the
#       field has text.
#   "key" = { text = "path" }
#       Text, with suit shorthand (!S, 4H) read as ♠♥♦♣; export writes !S !H !D !C.
#   "key" = { plain = "path" }    Text kept as typed.
#   "key" = { number = "path" }   A number; anything else is not read.
#   "key" = { range = "path" }
#       A range end ("14+"): the number, and a + or - after it to
#       `<path>_plus` / `<path>_minus` where the spec has them. With
#       `words = "path"`, words typed after the number ("17 Vul") go to that
#       field.
#   `export = false` on any entry: read but not written.
#
# [[any]]: a field set when any of the boxes is ticked. Export ticks the
# `export` boxes when the field is set and none of them is.
#
# [lead_holdings]: the lead grid. Swan gives each holding a tick per card
# (`Leads.vs_suits.ace_king.ace`); the card holds the card led by its place
# in the holding (lead_choice_akx = 1). `cards` names Swan's ticks in the
# holding's order; `holding` is the card's holding, or a list: the first is
# where the import writes, and the export reads the first that is set (the
# Classic card's AKJx row is the editor's AKxx(+) row).
#
# Rules in js/swan.js rather than here: the names (`General.name.names`).

