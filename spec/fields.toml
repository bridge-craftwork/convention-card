# ── Direct cue bids of their opening (Michaels) ──────────────────────
# Bridge-Classroom's DirectCuebidsMatrix (the ACBL card's "Direct
# cuebid" box): one row per meaning of our cue bid of their one-level
# opening, one column per kind of opening. Columns: art = artificial
# 1♣/1♦ (a strong club), quasi = a 1♣/1♦ that may be short,
# nat_minors = natural 1♣/1♦, nat_majors = 1♥/1♠. Rows: michaels = the
# two-suiter (over a minor both majors, over a major the other major and
# a minor), natural = the suit bid, other = something else (described in
# `description`). The rules (competitive/two-suited-overcalls.bid) read
# the Michaels cells of the natural columns and quasi; the other cells
# are recorded for the card.
[direct_cuebids]
