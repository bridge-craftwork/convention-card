# Teaching skills: the SkillPath strings Bridge-Classroom tags its lessons
# with (`[SkillPath "bidding_conventions/stayman"]`), which a card field
# (`skill = ...` in fields.toml) and a `.bid` module (`skill <path>` header
# lines) may name. `rbb bid check` warns about a path not listed here;
# `rbb bid skills` prints the map (docs/SKILLS.md).
#
# Three tables, each `"<category>/<name>" = "<display name>"`:
#   [taxonomy]  Bridge-Classroom's taxonomy, public/data/skillPaths.json
#               (names from src/utils/bakerBridgeTaxonomy.js), as of
#               2026-09-28. Keep it a copy: change it there first.
#   [lessons]   bidding SkillPath tags that lesson files use (Bridge-Classroom
#               and the Bridge-Lessons-* repositories) but skillPaths.json
#               lacks; the card-play ones are left out.
#   [proposed]  ours, for conventions the taxonomy has no skill for; not in
#               Bridge-Classroom yet (docs/drafts/bridge-classroom-skill-taxonomy-issue.md).

