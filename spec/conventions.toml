"""
see = [
  { title = "Benjamin Twos", site = "Wikipedia", url = "https://en.wikipedia.org/wiki/Benjamin_Twos" },
]

["bidding_conventions/french_2d"]
name = "French 2♦"
source = "proposed"
level = 8
names = ["French 2♦"]
summary = """
An opening 2♦ with an artificial meaning in the French style; details vary
by partnership, so the card's notes say which.
"""

["bidding_conventions/precision_2d"]
name = "Precision 2♦"
source = "proposed"
level = 7
names = ["Precision 2♦"]
summary = """
In Precision, an opening 2♦ shows a limited opening short in diamonds,
usually 4-4-1-4 or 4-4-0-5 with 11-15 points.
"""

["bidding_conventions/polish_two_suiters"]
name = "Polish two-suiters"
source = "proposed"
level = 9
names = ["Polish two-suiters", "Polish 2♥/2♠"]
summary = """
Weak openings at the two level that show two-suited hands, with the second
suit unknown or limited, as used in Polish Club.
"""

["bidding_conventions/wilkosz"]
name = "Wilkosz 2♦"
source = "proposed"
level = 9
names = ["Wilkosz"]
summary = """
An opening 2♦ showing a weak two-suited hand with at least five cards in
each of two suits, one of them a major.
"""

["bidding_conventions/namyats"]
name = "Namyats"
source = "proposed"
level = 6
names = ["Namyats", "4♣/4♦ transfer to 4♥/4♠", "South African Texas"]
summary = """
Openings of 4♣ and 4♦ show a strong four-level preempt in hearts and spades
respectively, so a direct 4♥ or 4♠ opening is weaker.
"""
see = [
  { title = "25 More Bridge Conventions You Should Know", kind = "book", chapter = 8 },
]

["bidding_conventions/kickback"]
name = "Kickback"
source = "proposed"
level = 9
names = ["Kickback", "Kickback keycard", "Redwood"]
summary = """
A keycard ask in the suit above trumps instead of 4NT: 4♦ with clubs as
