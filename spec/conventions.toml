["bidding_conventions/control_bids"]
name = "Control (Cue) Bids"
source = "proposed"
level = 5
names = ["Control bids", "Cue bids", "Cuebids", "Control-showing bids", "Italian cuebids", "Ace-and-king cuebids"]
summary = """
With a trump suit agreed and slam possible, bidding a new suit below game
shows a control there (an ace or void, and in many styles a king or
singleton), so the partnership can find out whether a suit is unguarded
before asking for keycards.
"""
see = [
  { title = "25 Bridge Conventions You Should Know", kind = "book", chapter = 20 },
  { title = "25 More Bridge Conventions You Should Know", kind = "book", chapter = 20 },
  { title = "Slam Bidding: Control-Showing Bids", by = "Robert S. Todd", site = "Advancing in Bridge", url = "https://www.advinbridge.com/this-week-in-bridge/406" },
]

["bidding_conventions/drury"]
name = "Drury"
source = "proposed"
level = 5
names = ["Drury", "Original Drury"]
summary = """
By a passed hand over partner's third- or fourth-seat 1♥ or 1♠, 2♣ asks
whether opener has a full opening, with a fit for the major. In the original
form opener's 2♦ shows a light opening; Reverse Drury swaps opener's
replies.
"""

["bidding_conventions/gerber"]
name = "Gerber"
source = "proposed"
level = 3
names = ["Gerber", "4♣ Gerber", "1430 Gerber"]
summary = """
A jump to 4♣ over partner's notrump asks for aces, with steps answering as
for Blackwood (4♦ none or four, 4♥ one, and so on), leaving 4NT as a natural
raise.
"""
see = [
  { title = "Gerber", site = "Bridge Bum", url = "https://www.bridgebum.com/gerber.php" },
  { title = "25 Bridge Conventions You Should Know", kind = "book", chapter = 1 },
  { title = "Slam Bidding: Gerber and 1430 Gerber", by = "Robert S. Todd", site = "Advancing in Bridge", url = "https://www.advinbridge.com/this-week-in-bridge/402" },
]

["bidding_conventions/impossible_2s"]
name = "Impossible 2♠"
source = "proposed"
level = 7
names = ["Impossible 2♠", "Impossible Spade", "Impossible 2S"]
summary = """
After 1♥–1NT–2♣ or 2♦, responder's 2♠ cannot be natural, so it shows a good
raise of opener's minor, forcing to three of it.
"""
see = [
  { title = "The Impossible Spade Bid", by = "Robert S. Todd", site = "Advancing in Bridge", url = "https://www.advinbridge.com/this-week-in-bridge/269" },
  { title = "Impossible 2 Spade", site = "Kiva Bridge Club", url = "http://kivabridgeclub.com/images/Impossible%202%20Spade.pdf" },
]

["bidding_conventions/inverted_minors"]
name = "Inverted Minor Raises"
source = "proposed"
level = 5
names = ["Inverted minors", "Inverted minor raises", "Inverted raises"]
summary = """
Over partner's 1♣ or 1♦, the single raise is strong (invitational or better,
forcing one round) and the jump raise is weak, the reverse of the natural
meanings. It usually denies a four-card major.
"""
see = [
  { title = "25 More Bridge Conventions You Should Know", kind = "book", chapter = 17 },
  { title = "Inverted Minors and 1D-2C Auctions with Structure", by = "Robert S. Todd", site = "Advancing in Bridge", url = "https://www.advinbridge.com/this-week-in-bridge/591" },
]

["bidding_conventions/minor_suit_transfers"]
name = "Minor-Suit Transfers over 1NT"
source = "proposed"
level = 5
names = ["minor suit transfers", "minor-suit transfers", "four-suit transfers", "4-way transfers", "four way transfers", "2♠ relay"]
summary = """
Over partner's 1NT, responder's 2♠ and 2NT (or 3♣) are transfers or relays
to the minors, so a long minor can be shown weak to play or strong with slam
interest.
"""
see = [
