]

["competitive_bidding/negative_doubles"]
name = "Negative Doubles"
source = "taxonomy"
level = 3
names = ["Negative double", "Negative doubles", "Sputnik"]
summary = """
After partner opens and the next player overcalls, responder's double is for
takeout, usually showing the unbid major or majors, so responder can compete
without a long suit or a fit.
"""
see = [
  { title = "Negative Doubles", by = "Larry Cohen", url = "https://www.larryco.com/bridge-articles/negative-doubles" },
