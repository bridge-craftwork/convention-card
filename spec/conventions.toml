  { title = "Slam Bidding: Dealing with Interference Over Ace-Asking Bids", by = "Robert S. Todd", site = "Advancing in Bridge", url = "https://www.advinbridge.com/this-week-in-bridge/536" },
]

["bidding_conventions/depo"]
name = "DEPO"
source = "proposed"
level = 7
names = ["DEPO", "Double even, pass odd"]
summary = """
Played instead of DOPI: when they interfere over a keycard ask, double shows
an even number of keycards and pass an odd number.
"""
see = [
  { title = "25 More Bridge Conventions You Should Know", kind = "book", chapter = 15 },
]

["competitive_bidding/modified_cappelletti"]
name = "Modified Cappelletti"
source = "proposed"
level = 6
names = ["Modified Cappelletti"]
summary = """
Played instead of Cappelletti: over their 1NT, 2♣ shows a one-suited minor
or a major and a minor, and 2♥ and 2♠ are natural one-suiters.
"""

["competitive_bidding/landy"]
name = "Landy"
source = "proposed"
level = 4
names = ["Landy"]
summary = """
Over their 1NT, 2♣ shows both majors; other overcalls are natural.
"""

["competitive_bidding/suction"]
name = "Suction"
source = "proposed"
level = 8
names = ["Suction"]
summary = """
Over their 1NT, each two-level suit bid shows either the next suit up or the
