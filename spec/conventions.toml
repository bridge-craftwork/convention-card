["bidding_conventions/puppet_stayman"]
name = "Puppet Stayman"
source = "proposed"
level = 7
names = ["Puppet Stayman", "Puppet", "5-card Stayman", "five-card Stayman"]
summary = """
A form of Stayman, usually over 2NT, that finds five-card majors as well as
four-card ones: 3♣ asks, opener shows a five-card major directly or bids 3♦
with a four-card major, and responder then bids the major responder does
not hold.
"""
see = [
  { title = "Puppet Stayman", site = "Bridge Bum", url = "https://www.bridgebum.com/puppet_stayman.php" },
  { title = "25 More Bridge Conventions You Should Know", kind = "book", chapter = 16 },
  { title = "NT Auctions: Puppet Stayman and 5-Card Stayman", by = "Robert S. Todd", site = "Advancing in Bridge", url = "https://www.advinbridge.com/this-week-in-bridge/523" },
]

["bidding_conventions/minor_suit_stayman"]
name = "Minor Suit Stayman"
source = "proposed"
level = 6
names = ["Minor Suit Stayman", "MSS", "2♠ Minor Suit Stayman"]
summary = """
Over partner's 1NT (or 2NT), a bid, usually 2♠, asks opener for a four-card
minor, for responder with both minors and slam interest or a hand looking
for a minor-suit game.
"""
see = [
  { title = "Minor Suit Stayman", site = "Bridge Bum", url = "https://www.bridgebum.com/minor_suit_stayman.php" },
]

["competitive_bidding/rubensohl"]
name = "Rubensohl"
source = "proposed"
level = 9
names = ["Rubensohl", "Transfer Lebensohl"]
summary = """
A transfer version of Lebensohl: after they overcall partner's 1NT,
responder's bids from 2NT up are transfers to the next suit, which lets
responder show a suit, a stopper or values at a lower level.
"""
see = [
  { title = "Transfer Lebensohl", by = "Larry Cohen", url = "https://www.larryco.com/bridge-articles/transfer-lebensohl" },
  { title = "NT Bidding: Modern, Transfer, and Modern Transfer Lebensohl", by = "Robert S. Todd", site = "Advancing in Bridge", url = "https://www.advinbridge.com/this-week-in-bridge/548" },
]

["bidding_conventions/gambling_3nt"]
name = "Gambling 3NT"
source = "proposed"
level = 6
names = ["Gambling 3NT", "Gambling", "Acol 3NT"]
summary = """
An opening 3NT showing a long, solid minor with little outside. Partner
passes with stoppers in the other suits, and otherwise runs to four or five
of the minor.
"""
see = [
  { title = "Gambling 3NT", site = "Bridge Bum", url = "https://www.bridgebum.com/gambling_3nt.php" },
  { title = "25 More Bridge Conventions You Should Know", kind = "book", chapter = 6 },
  { title = "NT Auctions: Trick-Showing NT Bids - Gambling 3NT and More", by = "Robert S. Todd", site = "Advancing in Bridge", url = "https://www.advinbridge.com/this-week-in-bridge/519" },
]

["bidding_conventions/forcing_1nt"]
name = "Forcing 1NT"
source = "proposed"
level = 4
names = ["Forcing 1NT", "Forcing NT", "1NT forcing", "1NT forcing response"]
summary = """
Over partner's 1♥ or 1♠, responder's 1NT is forcing for one round, covering
a wide range of hands including invitational ones; opener must bid again, on
a three-card minor if need be.
"""
see = [
  { title = "25 More Bridge Conventions You Should Know", kind = "book", chapter = 19 },
]

["bidding_conventions/semi_forcing_1nt"]
name = "Semi-forcing 1NT"
source = "proposed"
level = 5
names = ["Semi-forcing 1NT", "Semi-forcing NT", "1NT semi-forcing"]
summary = """
Played instead of the forcing 1NT: responder's 1NT over a major is forcing
only if opener has more than a minimum, so opener may pass with a balanced
minimum.
"""
see = [
  { title = "2 over 1 Game Forcing: Responder's Rebids after 1NT Semi-Forcing Response", by = "Robert S. Todd", site = "Advancing in Bridge", url = "https://www.advinbridge.com/this-week-in-bridge/375" },
]

["bidding_conventions/jacoby_2nt"]
name = "Jacoby 2NT"
source = "proposed"
level = 4
names = ["Jacoby 2NT", "Jacoby 2N", "Jacoby"]
summary = """
Over partner's 1♥ or 1♠, responder's 2NT shows four or more trumps and game-
forcing values. Opener's rebid describes the hand: a short suit at the three
level, a good second suit at the four level, or strength by 3M, 3NT or 4M.
"""
see = [
  { title = "25 Bridge Conventions You Should Know", kind = "book", chapter = 10 },
  { title = "Slam Bidding: Jacoby 2NT", by = "Robert S. Todd", site = "Advancing in Bridge", url = "https://www.advinbridge.com/this-week-in-bridge/407" },
]

["bidding_conventions/modified_jacoby_2nt"]
name = "Modified Jacoby 2NT"
source = "proposed"
level = 6
names = ["Modified Jacoby 2NT", "Modified Jacoby"]
summary = """
Played instead of standard Jacoby 2NT: responder's 2NT is the same raise,
but opener's rebids are rearranged, usually so that 3♣ shows a minimum and
responder can then ask for shortness.
"""

["bidding_conventions/splinters"]
name = "Splinters"
source = "proposed"
level = 5
names = ["Splinters", "Splinter", "Splinter bids", "Splinter raise", "Mini-splinters"]
summary = """
A double jump in a new suit, by responder or by opener, shows a singleton or
void there and a fit with game values, so partner can judge slam by how well
the hands fit.
"""
see = [
  { title = "25 Bridge Conventions You Should Know", kind = "book", chapter = 11 },
  { title = "Slam Bidding: Splinter Bids by Responder", by = "Robert S. Todd", site = "Advancing in Bridge", url = "https://www.advinbridge.com/this-week-in-bridge/408" },
  { title = "Slam Bidding: Splinters by Opener", by = "Robert S. Todd", site = "Advancing in Bridge", url = "https://www.advinbridge.com/this-week-in-bridge/409" },
]

["bidding_conventions/bergen_raises"]
name = "Bergen raises"
source = "proposed"
level = 5
names = ["Bergen", "Bergen raises", "Bergen raise"]
summary = """
Over partner's 1♥ or 1♠, responder's jumps to 3♣ and 3♦ show four-card
raises of different strength (usually 3♣ constructive, 3♦ limit) and 3M is
preemptive, so opener knows the fit and strength at once.
"""
see = [
  { title = "Bergen Raises", site = "Bridge Bum", url = "https://www.bridgebum.com/bergen_raises.php" },
  { title = "25 Bridge Conventions You Should Know", kind = "book", chapter = 13 },
  { title = "25 More Bridge Conventions You Should Know", kind = "book", chapter = 3 },
  { title = "Bergen Raises", by = "Robert S. Todd", site = "Advancing in Bridge", url = "https://www.advinbridge.com/this-week-in-bridge/572" },
]

["bidding_conventions/reverse_bergen_raises"]
name = "Reverse Bergen raises"
source = "proposed"
level = 6
names = ["Reverse Bergen"]
summary = """
Played instead of Bergen raises: the same four-card raises with the meanings
of 3♣ and 3♦ swapped.
"""

["bidding_conventions/two_way_drury"]
name = "Two-way Drury"
source = "proposed"
level = 6
names = ["Two-way Drury", "2-way Drury", "Two-way Reverse Drury"]
summary = """
Played instead of Drury: a passed hand's 2♣ and 2♦ over partner's third- or
fourth-seat major both show limit raises, split by trump length (usually 2♣
three trumps, 2♦ four).
"""
see = [
  { title = "Fits and More: 2-Way Reverse Drury", by = "Robert S. Todd", site = "Advancing in Bridge", url = "https://www.advinbridge.com/this-week-in-bridge/525" },
]

["bidding_conventions/gazzilli"]
name = "Gazzilli"
source = "proposed"
level = 9
names = ["Gazzilli"]
summary = """
After 1♥ or 1♠ and a 1NT response, opener's 2♣ is artificial: either natural
clubs or any strong hand. Responder's 2♦ asks, letting opener show strong
hands at the two level.
"""
