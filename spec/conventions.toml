count.
"""
see = [
  { title = "25 More Bridge Conventions You Should Know", kind = "book", chapter = 10 },
  { title = "Exclusion Keycard", by = "Robert S. Todd", site = "Advancing in Bridge", url = "https://www.advinbridge.com/this-week-in-bridge/584" },
]

["bidding_conventions/pick_a_slam_5nt"]
name = "Pick-a-slam 5NT"
source = "proposed"
level = 7
names = ["Pick-a-slam", "5NT pick a slam", "5NT choice of slams"]
summary = """
A 5NT bid, not after a keycard ask, asks partner to choose among several
possible slams, usually in notrump or in a suit partner prefers.
"""
see = [
  { title = "25 More Bridge Conventions You Should Know", kind = "book", chapter = 23 },
  { title = "Slam Bidding: 5NT Choice of Slams", by = "Robert S. Todd", site = "Advancing in Bridge", url = "https://www.advinbridge.com/this-week-in-bridge/535" },
]

["bidding_conventions/western_cuebid"]
name = "Western cue bid"
source = "proposed"
level = 4
names = ["Western cue bid", "Western cuebid", "Asking for a stopper"]
summary = """
A cue bid of the opponents' suit when looking for 3NT asks partner to bid
notrump with a stopper in that suit.
"""
see = [
  { title = "Thinking and Responding: Western Cuebids", by = "Robert S. Todd", site = "Advancing in Bridge", url = "https://www.advinbridge.com/this-week-in-bridge/510" },
]

["bidding_conventions/spiral"]
name = "Spiral"
source = "proposed"
level = 8
names = ["Spiral", "Spiral cue bids", "Spiral 2NT"]
summary = """
A relay that asks about trump length and quality in steps once a fit is
found, so the asker can judge game or slam from how good the trumps are.
