next suit to find out.
"""
see = [
  { title = "Suction", site = "Bridge Bum", url = "https://www.bridgebum.com/suction.php" },
]

["competitive_bidding/maximal_doubles"]
name = "Maximal doubles"
source = "proposed"
level = 6
names = ["Maximal double", "Maximal doubles"]
