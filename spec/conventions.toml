then never take the auction past five of the trump suit.
"""
see = [
  { title = "Kickback Keycard Ask", by = "Robert S. Todd", site = "Advancing in Bridge", url = "https://www.advinbridge.com/this-week-in-bridge/582" },
]

["bidding_conventions/minorwood"]
name = "Minorwood"
source = "proposed"
level = 7
names = ["Minorwood", "4m keycard", "Crosswood"]
summary = """
With a minor agreed, four of that minor asks for keycards instead of 4NT,
keeping the answers low enough to stop in five of the minor.
"""
see = [
  { title = "Slam Bidding: Minorwood", by = "Robert S. Todd", site = "Advancing in Bridge", url = "https://www.advinbridge.com/this-week-in-bridge/405" },
]

["bidding_conventions/exclusion_blackwood"]
name = "Exclusion Blackwood"
source = "proposed"
level = 7
names = ["Exclusion Blackwood", "Exclusion", "Exclusion RKC", "Voidwood"]
summary = """
A jump to the five level in a new suit after agreeing trumps shows a void
