["bidding_conventions/blackwood"]
name = "Blackwood"
source = "taxonomy"
level = 2
names = ["Blackwood", "Standard Blackwood", "Easley Blackwood", "Plain Blackwood", "4NT ace ask"]
summary = """
Once a trump suit is agreed, 4NT asks how many aces partner holds: 5♣ none
or four, 5♦ one, 5♥ two, 5♠ three. 5NT then asks for kings the same way.
"""
see = [
  { title = "25 Bridge Conventions You Should Know", kind = "book", chapter = 1 },
]

["bidding_conventions/fourth_suit_forcing"]
name = "Fourth Suit Forcing"
source = "taxonomy"
level = 5
names = ["Fourth suit forcing", "4th suit forcing", "FSF", "Fourth suit game force"]
summary = """
When three suits have been bid, responder's bid of the fourth suit is
artificial and forcing (for one round, or to game by agreement), asking
opener to describe the hand further.
"""
see = [
  { title = "Fourth Suit Forcing", site = "Bridge Bum", url = "https://www.bridgebum.com/fourth_suit_forcing.php" },
  { title = "25 Bridge Conventions You Should Know", kind = "book", chapter = 21 },
  { title = "2/1: Bidding the 4th Suit", by = "Robert S. Todd", site = "Advancing in Bridge", url = "https://www.advinbridge.com/this-week-in-bridge/424" },
]

["bidding_conventions/help_suit_game_try"]
name = "Help Suit Game Try"
source = "taxonomy"
level = 5
names = ["Help suit game try", "Help-suit game try", "Help suit"]
summary = """
After a major-suit raise, opener's new suit is a game try asking for help
there: responder bids game with honours or shortness in that suit and signs
off without.
"""
see = [
  { title = "Help Suit Game Try", site = "Bridge Bum", url = "https://www.bridgebum.com/help_suit_game_try.php" },
  { title = "25 Bridge Conventions You Should Know", kind = "book", chapter = 14 },
  { title = "Help Suit Game Tries", by = "Robert S. Todd", site = "Advancing in Bridge", url = "https://www.advinbridge.com/this-week-in-bridge/465" },
]

["bidding_conventions/jacoby_2nt_splinters"]
name = "Jacoby 2NT & Splinters"
source = "taxonomy"
level = 4

["bidding_conventions/jacoby_transfers"]
name = "Jacoby Transfers"
source = "taxonomy"
level = 3
names = ["Jacoby transfers", "Jacoby", "transfers", "Texas", "Texas transfers", "4-level transfers"]
summary = """
Over partner's 1NT, 2♦ shows five or more hearts and 2♥ five or more spades;
opener bids the next suit, so the strong hand declares. Texas does the same
at the four level (4♦ for hearts, 4♥ for spades) with game values.
"""
see = [
  { title = "Texas Transfer", site = "Bridge Bum", url = "https://www.bridgebum.com/texas_transfer.php" },
  { title = "25 Bridge Conventions You Should Know", kind = "book", chapter = 2 },
  { title = "NT Auctions: Opponents' Doubles of Our Stayman and Transfers", by = "Robert S. Todd", site = "Advancing in Bridge", url = "https://www.advinbridge.com/this-week-in-bridge/520" },
]

["bidding_conventions/new_minor_forcing"]
name = "New Minor Forcing"
source = "taxonomy"
level = 5
names = ["New minor forcing", "NMF"]
summary = """
After opener's 1NT rebid, responder's bid of the unbid minor is artificial
and forcing, asking opener about three-card support for responder's major or
a four-card other major.
"""
see = [
  { title = "25 Bridge Conventions You Should Know", kind = "book", chapter = 22 },
  { title = "New Minor Forcing Fundamentals", by = "Robert S. Todd", site = "Advancing in Bridge", url = "https://www.advinbridge.com/this-week-in-bridge/227" },
]

["bidding_conventions/ogust"]
name = "Ogust"
source = "taxonomy"
level = 5
names = ["Ogust", "Ogust 2NT"]
summary = """
After partner's weak two, responder's 2NT asks about the hand in steps: 3♣
bad hand bad suit, 3♦ bad hand good suit, 3♥ good hand bad suit, 3♠ good
hand good suit, 3NT a solid suit.
"""
see = [
  { title = "Ogust", site = "Bridge Bum", url = "https://www.bridgebum.com/ogust.php" },
]

["bidding_conventions/preemptive_bids"]
name = "Preemptive Bids"
source = "taxonomy"
level = 3

["bidding_conventions/reverse_bids"]
name = "Reverse Bids"
source = "taxonomy"
level = 4
names = ["Reverse", "Reverses", "Reverse bid"]
summary = """
Opener's rebid in a new suit higher than the first, at the two level, shows
extra strength and a longer first suit; it is forcing for one round in most
styles.
"""
see = [
  { title = "25 Bridge Conventions You Should Know", kind = "book", chapter = 7 },
]

["bidding_conventions/reverse_drury"]
name = "Reverse Drury"
source = "taxonomy"
level = 5
names = ["Reverse Drury", "Drury"]
summary = """
By a passed hand over partner's third- or fourth-seat 1♥ or 1♠, 2♣ shows a
limit raise with three or more trumps. Opener rebids two of the major with a
light opening; other bids show a full one.
"""
see = [
  { title = "25 Bridge Conventions You Should Know", kind = "book", chapter = 12 },
  { title = "Fits and More: 2-Way Reverse Drury", by = "Robert S. Todd", site = "Advancing in Bridge", url = "https://www.advinbridge.com/this-week-in-bridge/525" },
]

["bidding_conventions/roman_keycard"]
name = "Roman Keycard"
source = "taxonomy"
level = 4
names = ["RKCB", "Roman Keycard", "Roman Key Card Blackwood", "Keycard", "1430", "0314"]
summary = """
4NT asks for five keycards, the four aces and the trump king. 1430 answers
5♣ one or four, 5♦ three or none, 5♥ two without the trump queen, 5♠ two
with it; 0314 swaps 5♣ and 5♦. The next step asks for the trump queen.
"""
see = [
  { title = "25 Bridge Conventions You Should Know", kind = "book", chapter = 9 },
  { title = "Slam Bidding: 1430 Keycard Blackwood", by = "Robert S. Todd", site = "Advancing in Bridge", url = "https://www.advinbridge.com/this-week-in-bridge/403" },
]

["bidding_conventions/stayman"]
name = "Stayman"
source = "taxonomy"
level = 3
names = ["Stayman", "Regular Stayman", "Non-forcing Stayman", "Forcing Stayman", "Garbage Stayman", "Crawling Stayman"]
summary = """
Over partner's 1NT, 2♣ asks opener for a four-card major: 2♦ denies one, 2♥
or 2♠ shows it. Responder uses it to find a 4-4 major fit with invitational
or better values; Garbage Stayman uses it weak, planning to pass any reply.
"""
see = [
  { title = "Stayman", site = "Bridge Bum", url = "https://www.bridgebum.com/stayman.php" },
  { title = "25 Bridge Conventions You Should Know", kind = "book", chapter = 3 },
  { title = "25 More Bridge Conventions You Should Know", kind = "book", chapter = 9 },
  { title = "Stayman Auctions After a 2NT Opening", by = "Robert S. Todd", site = "Advancing in Bridge", url = "https://www.advinbridge.com/this-week-in-bridge/633" },
]

["bidding_conventions/strong_2c"]
name = "Strong 2♣"
source = "taxonomy"
level = 3
names = ["Strong 2♣", "2♣ strong", "Strong artificial 2♣", "2♣ forcing"]
summary = """
An opening 2♣, artificial and forcing, for the strongest hands: game-forcing
or nearly so, balanced or not. Responder usually bids 2♦ to wait, and opener
then describes the hand.
"""
see = [
  { title = "Strong 2♣", site = "Bridge Bum", url = "https://www.bridgebum.com/strong_2c.php" },
  { title = "25 Bridge Conventions You Should Know", kind = "book", chapter = 6 },
  { title = "2C Opening Bids", by = "Robert S. Todd", site = "Advancing in Bridge", url = "https://www.advinbridge.com/this-week-in-bridge/415" },
]

["bidding_conventions/two_over_one"]
name = "2/1 Game Force"
source = "taxonomy"
level = 4
names = ["2/1", "2/1 game force", "two over one", "2 over 1", "2/1 GF"]
summary = """
After a one-level opening, responder's new suit at the two level, without
jumping and by an unpassed hand, forces to game. The auction can then go
slowly, with room to describe both hands.
"""
see = [
  { title = "2 over 1 Game Forcing: Modern Bridge Standard", by = "Robert S. Todd", site = "Advancing in Bridge", url = "https://www.advinbridge.com/this-week-in-bridge/641" },
]

["bidding_conventions/weak_2s"]
name = "Weak Twos"
source = "taxonomy"
level = 3
names = ["Weak twos", "Weak two", "Weak 2", "Weak two-bids"]
summary = """
An opening 2♦, 2♥ or 2♠ shows a good six-card suit and less than an opening
bid, as a preempt. Responder's 2NT usually asks for more, and a raise
continues the preempt.
"""
see = [
  { title = "Weak Two", site = "Bridge Bum", url = "https://www.bridgebum.com/weak_two.php" },
  { title = "25 Bridge Conventions You Should Know", kind = "book", chapter = 5 },
  { title = "Modern 2-Level Preemptive Openings", by = "Robert S. Todd", site = "Advancing in Bridge", url = "https://www.advinbridge.com/this-week-in-bridge/411" },
]

["competitive_bidding/dont"]
name = "DONT"
source = "taxonomy"
level = 5
names = ["DONT", "D.O.N.T.", "Disturb Opponents' No Trump", "Disturbing Opponents NT"]
summary = """
Over their strong 1NT: double shows one long suit (partner relays 2♣); 2♣
and 2♦ show that suit and a higher one; 2♥ both majors; 2♠ six or more
spades.
"""
see = [
  { title = "DONT", site = "Bridge Bum", url = "https://www.bridgebum.com/dont.php" },
  { title = "25 Bridge Conventions You Should Know", kind = "book", chapter = 18 },
  { title = "25 More Bridge Conventions You Should Know", kind = "book", chapter = 7 },
  { title = "NT Bidding: DONT and Meckwell", by = "Robert S. Todd", site = "Advancing in Bridge", url = "https://www.advinbridge.com/this-week-in-bridge/541" },
]

["competitive_bidding/lebensohl"]
name = "Lebensohl"
source = "taxonomy"
level = 5
names = ["Lebensohl", "Lebensohl over interference", "slow shows", "fast denies"]
summary = """
When they overcall partner's 1NT, responder's 2NT is a relay to 3♣: the two-
step route shows a weaker or different hand from a direct bid, and whether
responder cue-bids fast or slow tells whether a stopper is held.
"""
see = [
  { title = "Lebensohl", by = "Larry Cohen", url = "https://www.larryco.com/bridge-articles/lebensohl" },
  { title = "25 Bridge Conventions You Should Know", kind = "book", chapter = 25 },
  { title = "NT Bidding: Responding to 1NT in Competition - Lebensohl", by = "Robert S. Todd", site = "Advancing in Bridge", url = "https://www.advinbridge.com/this-week-in-bridge/545" },
]

["competitive_bidding/michaels_unusual"]
name = "Michaels & Unusual 2NT"
source = "taxonomy"
level = 4
names = ["Michaels", "Michaels cue bid", "Michaels cuebid", "Unusual 2NT", "Unusual notrump", "Unusual NT"]
summary = """
Two-suited overcalls. A cue bid of their suit shows five-five in two other
suits (over a minor, the majors; over a major, the other major and a minor);
a jump to 2NT shows the two lowest unbid suits.
"""
see = [
  { title = "Michaels Cuebid", site = "Bridge Bum", url = "https://www.bridgebum.com/michaels_cuebid.php" },
  { title = "25 Bridge Conventions You Should Know", kind = "book", chapter = 17 },
  { title = "Competitive Bidding: Michaels Cuebid", by = "Robert S. Todd", site = "Advancing in Bridge", url = "https://www.advinbridge.com/this-week-in-bridge/480" },
  { title = "Competitive Bidding: Unusual 2NT", by = "Robert S. Todd", site = "Advancing in Bridge", url = "https://www.advinbridge.com/this-week-in-bridge/481" },
]

["competitive_bidding/negative_doubles"]
name = "Negative Doubles"
source = "taxonomy"
level = 3
names = ["Negative double", "Negative doubles", "Sputnik"]
summary = """
After partner opens and the next player overcalls, responder's double is for
takeout, usually showing the unbid major or majors, so responder can compete
without a long suit or a fit.
"""
see = [
  { title = "Negative Doubles", by = "Larry Cohen", url = "https://www.larryco.com/bridge-articles/negative-doubles" },
