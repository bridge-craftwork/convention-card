["bidding_conventions/reverse_drury"]
name = "Reverse Drury"
source = "taxonomy"
level = 5
names = ["Reverse Drury", "Drury"]
summary = """
By a passed hand over partner's third- or fourth-seat 1♥ or 1♠, 2♣ shows a
limit raise with three or more trumps. Opener rebids two of the major with a
light opening; other bids show a full one.
"""
see = [
  { title = "25 Bridge Conventions You Should Know", kind = "book", chapter = 12 },
  { title = "Fits and More: 2-Way Reverse Drury", by = "Robert S. Todd", site = "Advancing in Bridge", url = "https://www.advinbridge.com/this-week-in-bridge/525" },
]

["bidding_conventions/roman_keycard"]
name = "Roman Keycard"
source = "taxonomy"
level = 4
names = ["RKCB", "Roman Keycard", "Roman Key Card Blackwood", "Keycard", "1430", "0314"]
summary = """
4NT asks for five keycards, the four aces and the trump king. 1430 answers
5♣ one or four, 5♦ three or none, 5♥ two without the trump queen, 5♠ two
with it; 0314 swaps 5♣ and 5♦. The next step asks for the trump queen.
"""
see = [
  { title = "25 Bridge Conventions You Should Know", kind = "book", chapter = 9 },
  { title = "Slam Bidding: 1430 Keycard Blackwood", by = "Robert S. Todd", site = "Advancing in Bridge", url = "https://www.advinbridge.com/this-week-in-bridge/403" },
]

["bidding_conventions/stayman"]
name = "Stayman"
source = "taxonomy"
level = 3
names = ["Stayman", "Regular Stayman", "Non-forcing Stayman", "Forcing Stayman", "Garbage Stayman", "Crawling Stayman"]
summary = """
Over partner's 1NT, 2♣ asks opener for a four-card major: 2♦ denies one, 2♥
or 2♠ shows it. Responder uses it to find a 4-4 major fit with invitational
or better values; Garbage Stayman uses it weak, planning to pass any reply.
"""
see = [
  { title = "Stayman", site = "Bridge Bum", url = "https://www.bridgebum.com/stayman.php" },
  { title = "25 Bridge Conventions You Should Know", kind = "book", chapter = 3 },
  { title = "25 More Bridge Conventions You Should Know", kind = "book", chapter = 9 },
  { title = "Stayman Auctions After a 2NT Opening", by = "Robert S. Todd", site = "Advancing in Bridge", url = "https://www.advinbridge.com/this-week-in-bridge/633" },
]

["bidding_conventions/strong_2c"]
name = "Strong 2♣"
source = "taxonomy"
level = 3
names = ["Strong 2♣", "2♣ strong", "Strong artificial 2♣", "2♣ forcing"]
summary = """
An opening 2♣, artificial and forcing, for the strongest hands: game-forcing
or nearly so, balanced or not. Responder usually bids 2♦ to wait, and opener
then describes the hand.
"""
see = [
  { title = "Strong 2♣", site = "Bridge Bum", url = "https://www.bridgebum.com/strong_2c.php" },
  { title = "25 Bridge Conventions You Should Know", kind = "book", chapter = 6 },
  { title = "2C Opening Bids", by = "Robert S. Todd", site = "Advancing in Bridge", url = "https://www.advinbridge.com/this-week-in-bridge/415" },
]

["bidding_conventions/two_over_one"]
name = "2/1 Game Force"
source = "taxonomy"
level = 4
names = ["2/1", "2/1 game force", "two over one", "2 over 1", "2/1 GF"]
summary = """
After a one-level opening, responder's new suit at the two level, without
jumping and by an unpassed hand, forces to game. The auction can then go
slowly, with room to describe both hands.
"""
see = [
  { title = "2 over 1 Game Forcing: Modern Bridge Standard", by = "Robert S. Todd", site = "Advancing in Bridge", url = "https://www.advinbridge.com/this-week-in-bridge/641" },
]

["bidding_conventions/weak_2s"]
name = "Weak Twos"
source = "taxonomy"
level = 3
names = ["Weak twos", "Weak two", "Weak 2", "Weak two-bids"]
summary = """
An opening 2♦, 2♥ or 2♠ shows a good six-card suit and less than an opening
bid, as a preempt. Responder's 2NT usually asks for more, and a raise
continues the preempt.
"""
see = [
  { title = "Weak Two", site = "Bridge Bum", url = "https://www.bridgebum.com/weak_two.php" },
  { title = "25 Bridge Conventions You Should Know", kind = "book", chapter = 5 },
  { title = "Modern 2-Level Preemptive Openings", by = "Robert S. Todd", site = "Advancing in Bridge", url = "https://www.advinbridge.com/this-week-in-bridge/411" },
]

