# The standard conventions and skills (ADR-0001): one entry per ID.
#
# A convention is a skill that can appear on a card (ADR-0001 D2), so both
# live here, keyed by the same ID: a skill path, `category/name`. Card fields
# name their convention with `skill` (fields.toml); lessons, `.bid` modules and
# scenarios use the same ID.
#
# Attributes:
#   name     display name
#   source   where the ID came from: "taxonomy" (Bridge-Classroom's list,
#            public/data/skillPaths.json, as of 2026-09-28), "lessons" (a tag
#            lesson files use that the taxonomy lacks) or "proposed" (ours)
#   level    1-10, how hard it is to learn: the lowest level at which it is
#            taught. Its extensions carry their own levels on their fields.
#            Named bands are derived, never stored: basic 1-3, intermediate
#            4-6, advanced 7-8, expert 9-10 (DECISIONS.md, 11-13)
#   names    the ways people write it, for finding it in a card's free text
#   summary  what it is, in a few lines of our own words, sized for a chat
#            line; suits as ♣♦♥♠
#   see      citations only: where to read more, and what informed our
#            treatment. Never another source's text, summaries or levels.
#            Each { title, by?, site?, url?, kind? ("book"), chapter? }
#
# See docs/DESIGN.md, "Describing a convention" and "Difficulty levels".

