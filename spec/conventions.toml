]

["bidding_conventions/smolen"]
name = "Smolen"
source = "proposed"
level = 4
names = ["Smolen"]
summary = """
After 1NT–2♣–2♦, responder with five cards in one major, four in the other
and game values jumps to three of the four-card major, so the strong hand
becomes declarer in a 5-3 fit.
"""
see = [
  { title = "Smolen and 5/5 Majors After a 2NT Opening", by = "Robert S. Todd", site = "Advancing in Bridge", url = "https://www.advinbridge.com/this-week-in-bridge/634" },
]

["bidding_conventions/super_accept"]
name = "Super-Accepting a Transfer"
source = "proposed"
level = 5
names = ["super-accept", "super accept", "superaccept", "super-acceptance"]
summary = """
After partner's transfer over 1NT, opener with four-card support and a
maximum bids above the two-level completion to say so, and responder can bid
a thin game.
"""
see = [
  { title = "NT Auctions: Superaccepting Jacoby Transfers", by = "Robert S. Todd", site = "Advancing in Bridge", url = "https://www.advinbridge.com/this-week-in-bridge/518" },
]

["competitive_bidding/cappelletti"]
name = "Cappelletti over 1NT"
source = "proposed"
level = 5
names = ["Cappelletti", "Hamilton", "Pottage"]
summary = """
Over their 1NT: double is for penalty, 2♣ shows a one-suited hand, 2♦ both
majors, 2♥ and 2♠ that major and a minor, 2NT both minors.
"""
see = [
  { title = "25 More Bridge Conventions You Should Know", kind = "book", chapter = 1 },
]

