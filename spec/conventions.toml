]

["competitive_bidding/leaping_michaels"]
name = "Leaping Michaels"
source = "proposed"
level = 7
names = ["Leaping Michaels"]
summary = """
Over their weak two, a jump to four of a minor shows that minor and the
other major (or both majors over a minor), five-five with game values.
"""
see = [
  { title = "Leaping Michaels", site = "Bridge Bum", url = "https://www.bridgebum.com/leaping_michaels.php" },
  { title = "25 More Bridge Conventions You Should Know", kind = "book", chapter = 18 },
