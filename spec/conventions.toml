["competitive_bidding/support_doubles"]
name = "Support Doubles and Redoubles"
source = "proposed"
level = 5
names = ["Support double", "Support doubles", "Support redouble"]
summary = """
After opener's one-level opening and responder's one-level suit, when the
next player bids, opener's double shows exactly three-card support for
responder (a redouble after their double), and a raise shows four.
"""
see = [
  { title = "Support Double", site = "Bridge Bum", url = "https://www.bridgebum.com/support_double.php" },
  { title = "25 More Bridge Conventions You Should Know", kind = "book", chapter = 13 },
  { title = "Support Doubles", by = "Robert S. Todd", site = "Advancing in Bridge", url = "https://www.advinbridge.com/this-week-in-bridge/355" },
]

["competitive_bidding/unusual_vs_unusual"]
name = "Unusual vs Unusual"
source = "proposed"
level = 8
names = ["Unusual vs Unusual", "Unusual over Unusual", "UvU"]
summary = """
After they show two suits with Michaels or the Unusual 2NT, cue bids of
their suits show hands in the other two suits: one cue bid a raise of
partner, the other a strong hand in the fourth suit.
"""
see = [
  { title = "25 More Bridge Conventions You Should Know", kind = "book", chapter = 21 },
  { title = "Unusual vs. Unusual and Unusual vs. Michaels", by = "Robert S. Todd", site = "Advancing in Bridge", url = "https://www.advinbridge.com/this-week-in-bridge/470" },
]

["bidding_conventions/puppet_stayman"]
name = "Puppet Stayman"
source = "proposed"
level = 7
names = ["Puppet Stayman", "Puppet", "5-card Stayman", "five-card Stayman"]
summary = """
A form of Stayman, usually over 2NT, that finds five-card majors as well as
four-card ones: 3♣ asks, opener shows a five-card major directly or bids 3♦
with a four-card major, and responder then bids the major responder does
not hold.
"""
see = [
  { title = "Puppet Stayman", site = "Bridge Bum", url = "https://www.bridgebum.com/puppet_stayman.php" },
  { title = "25 More Bridge Conventions You Should Know", kind = "book", chapter = 16 },
  { title = "NT Auctions: Puppet Stayman and 5-Card Stayman", by = "Robert S. Todd", site = "Advancing in Bridge", url = "https://www.advinbridge.com/this-week-in-bridge/523" },
]

["bidding_conventions/minor_suit_stayman"]
name = "Minor Suit Stayman"
source = "proposed"
level = 6
names = ["Minor Suit Stayman", "MSS", "2♠ Minor Suit Stayman"]
summary = """
Over partner's 1NT (or 2NT), a bid, usually 2♠, asks opener for a four-card
minor, for responder with both minors and slam interest or a hand looking
for a minor-suit game.
"""
see = [
  { title = "Minor Suit Stayman", site = "Bridge Bum", url = "https://www.bridgebum.com/minor_suit_stayman.php" },
]

["competitive_bidding/rubensohl"]
name = "Rubensohl"
source = "proposed"
level = 9
names = ["Rubensohl", "Transfer Lebensohl"]
summary = """
A transfer version of Lebensohl: after they overcall partner's 1NT,
responder's bids from 2NT up are transfers to the next suit, which lets
responder show a suit, a stopper or values at a lower level.
"""
see = [
  { title = "Transfer Lebensohl", by = "Larry Cohen", url = "https://www.larryco.com/bridge-articles/transfer-lebensohl" },
  { title = "NT Bidding: Modern, Transfer, and Modern Transfer Lebensohl", by = "Robert S. Todd", site = "Advancing in Bridge", url = "https://www.advinbridge.com/this-week-in-bridge/548" },
]

["bidding_conventions/gambling_3nt"]
name = "Gambling 3NT"
source = "proposed"
level = 6
names = ["Gambling 3NT", "Gambling", "Acol 3NT"]
summary = """
An opening 3NT showing a long, solid minor with little outside. Partner
passes with stoppers in the other suits, and otherwise runs to four or five
of the minor.
"""
see = [
  { title = "Gambling 3NT", site = "Bridge Bum", url = "https://www.bridgebum.com/gambling_3nt.php" },
  { title = "25 More Bridge Conventions You Should Know", kind = "book", chapter = 6 },
  { title = "NT Auctions: Trick-Showing NT Bids - Gambling 3NT and More", by = "Robert S. Todd", site = "Advancing in Bridge", url = "https://www.advinbridge.com/this-week-in-bridge/519" },
]

["bidding_conventions/forcing_1nt"]
name = "Forcing 1NT"
source = "proposed"
level = 4
names = ["Forcing 1NT", "Forcing NT", "1NT forcing", "1NT forcing response"]
summary = """
Over partner's 1♥ or 1♠, responder's 1NT is forcing for one round, covering
a wide range of hands including invitational ones; opener must bid again, on
a three-card minor if need be.
"""
see = [
  { title = "25 More Bridge Conventions You Should Know", kind = "book", chapter = 19 },
]

["bidding_conventions/semi_forcing_1nt"]
name = "Semi-forcing 1NT"
source = "proposed"
level = 5
names = ["Semi-forcing 1NT", "Semi-forcing NT", "1NT semi-forcing"]
summary = """
Played instead of the forcing 1NT: responder's 1NT over a major is forcing
only if opener has more than a minimum, so opener may pass with a balanced
minimum.
"""
see = [
  { title = "2 over 1 Game Forcing: Responder's Rebids after 1NT Semi-Forcing Response", by = "Robert S. Todd", site = "Advancing in Bridge", url = "https://www.advinbridge.com/this-week-in-bridge/375" },
]

["bidding_conventions/jacoby_2nt"]
name = "Jacoby 2NT"
source = "proposed"
level = 4
names = ["Jacoby 2NT", "Jacoby 2N", "Jacoby"]
summary = """
Over partner's 1♥ or 1♠, responder's 2NT shows four or more trumps and game-
forcing values. Opener's rebid describes the hand: a short suit at the three
level, a good second suit at the four level, or strength by 3M, 3NT or 4M.
"""
see = [
  { title = "25 Bridge Conventions You Should Know", kind = "book", chapter = 10 },
  { title = "Slam Bidding: Jacoby 2NT", by = "Robert S. Todd", site = "Advancing in Bridge", url = "https://www.advinbridge.com/this-week-in-bridge/407" },
]

["bidding_conventions/modified_jacoby_2nt"]
name = "Modified Jacoby 2NT"
source = "proposed"
level = 6
names = ["Modified Jacoby 2NT", "Modified Jacoby"]
summary = """
Played instead of standard Jacoby 2NT: responder's 2NT is the same raise,
but opener's rebids are rearranged, usually so that 3♣ shows a minimum and
responder can then ask for shortness.
"""

["bidding_conventions/splinters"]
name = "Splinters"
source = "proposed"
level = 5
names = ["Splinters", "Splinter", "Splinter bids", "Splinter raise", "Mini-splinters"]
summary = """
A double jump in a new suit, by responder or by opener, shows a singleton or
void there and a fit with game values, so partner can judge slam by how well
the hands fit.
"""
see = [
  { title = "25 Bridge Conventions You Should Know", kind = "book", chapter = 11 },
  { title = "Slam Bidding: Splinter Bids by Responder", by = "Robert S. Todd", site = "Advancing in Bridge", url = "https://www.advinbridge.com/this-week-in-bridge/408" },
  { title = "Slam Bidding: Splinters by Opener", by = "Robert S. Todd", site = "Advancing in Bridge", url = "https://www.advinbridge.com/this-week-in-bridge/409" },
]

["bidding_conventions/bergen_raises"]
name = "Bergen raises"
source = "proposed"
level = 5
names = ["Bergen", "Bergen raises", "Bergen raise"]
summary = """
Over partner's 1♥ or 1♠, responder's jumps to 3♣ and 3♦ show four-card
raises of different strength (usually 3♣ constructive, 3♦ limit) and 3M is
preemptive, so opener knows the fit and strength at once.
"""
see = [
  { title = "Bergen Raises", site = "Bridge Bum", url = "https://www.bridgebum.com/bergen_raises.php" },
  { title = "25 Bridge Conventions You Should Know", kind = "book", chapter = 13 },
  { title = "25 More Bridge Conventions You Should Know", kind = "book", chapter = 3 },
  { title = "Bergen Raises", by = "Robert S. Todd", site = "Advancing in Bridge", url = "https://www.advinbridge.com/this-week-in-bridge/572" },
]

["bidding_conventions/reverse_bergen_raises"]
name = "Reverse Bergen raises"
source = "proposed"
level = 6
names = ["Reverse Bergen"]
summary = """
Played instead of Bergen raises: the same four-card raises with the meanings
of 3♣ and 3♦ swapped.
"""

["bidding_conventions/two_way_drury"]
name = "Two-way Drury"
source = "proposed"
level = 6
names = ["Two-way Drury", "2-way Drury", "Two-way Reverse Drury"]
summary = """
Played instead of Drury: a passed hand's 2♣ and 2♦ over partner's third- or
fourth-seat major both show limit raises, split by trump length (usually 2♣
three trumps, 2♦ four).
"""
see = [
  { title = "Fits and More: 2-Way Reverse Drury", by = "Robert S. Todd", site = "Advancing in Bridge", url = "https://www.advinbridge.com/this-week-in-bridge/525" },
]

["bidding_conventions/gazzilli"]
name = "Gazzilli"
source = "proposed"
level = 9
names = ["Gazzilli"]
summary = """
After 1♥ or 1♠ and a 1NT response, opener's 2♣ is artificial: either natural
clubs or any strong hand. Responder's 2♦ asks, letting opener show strong
hands at the two level.
"""
see = [
  { title = "Constructive Bidding: Modern Gazzilli", by = "Robert S. Todd", site = "Advancing in Bridge", url = "https://www.advinbridge.com/this-week-in-bridge/488" },
]

["bidding_conventions/walsh"]
name = "Walsh"
source = "proposed"
level = 4
names = ["Walsh", "Walsh style", "Walsh responses"]
summary = """
Over partner's 1♣, responder with a weak or moderate hand bids a four-card
major ahead of longer diamonds, so opener can rebid 1NT with any balanced
hand knowing no 4-4 major fit is lost.
"""
see = [
  { title = "Walsh Style", by = "Larry Cohen", url = "https://www.larryco.com/bridge-articles/walsh-style" },
  { title = "Thinking and Responding: Walsh and Extended Walsh", by = "Robert S. Todd", site = "Advancing in Bridge", url = "https://www.advinbridge.com/this-week-in-bridge/511" },
]

["bidding_conventions/transfer_walsh"]
name = "Transfer Walsh"
source = "proposed"
level = 9
names = ["Transfer Walsh", "Transfer responses to 1♣", "transfer responses"]
summary = """
Over partner's 1♣, responder's 1♦ and 1♥ are transfers to the next suit,
showing four or more cards in it, and 1♠ denies a four-card major. Opener
can accept the transfer, so the 1♣ hand often declares.
"""
see = [
  { title = "Transfer Walsh", site = "Wikipedia", url = "https://en.wikipedia.org/wiki/Transfer_Walsh" },
]

["bidding_conventions/kokish"]
name = "Kokish relay"
source = "proposed"
level = 8
names = ["Kokish", "Kokish relay"]
summary = """
After 2♣–2♦, opener's 2♥ is a relay: either hearts or a strong balanced
hand. Responder must bid 2♠, and opener's next bid says which, which keeps
the strong 2NT rebid out of the way.
"""
see = [
  { title = "Kokish Relay", site = "Bridge Bum", url = "https://www.bridgebum.com/kokish_relay.php" },
  { title = "Kokish Over Strong 2C", by = "Robert S. Todd", site = "Advancing in Bridge", url = "https://www.advinbridge.com/this-week-in-bridge/576" },
]

["bidding_conventions/two_heart_bust"]
name = "2♥ bust over 2♣"
source = "proposed"
level = 7
names = ["Parrish", "2♥ bust", "Parrish 2♥ bust", "Double negative", "Second negative"]
summary = """
After 2♣–2♦ and opener's natural rebid, a cheapest-suit reply shows a very
weak hand, so opener knows when to stop short of game. The Parrish form uses
2♥ as the bust in some auctions.
"""
see = [
  { title = "Todd Busts over 2C Opening Bids", by = "Robert S. Todd", site = "Advancing in Bridge", url = "https://www.advinbridge.com/this-week-in-bridge/593" },
]

["bidding_conventions/mccabe"]
name = "McCabe adjunct"
source = "proposed"
level = 8
names = ["McCabe", "McCabe adjunct"]
summary = """
After partner's weak two is doubled, responder's new suits and 2NT say what
to lead rather than show length, so the partnership can compete and direct
the defence at once.
"""
see = [
  { title = "McCabe Responses to Preempts", by = "Robert S. Todd", site = "Advancing in Bridge", url = "https://www.advinbridge.com/this-week-in-bridge/468" },
  { title = "Transfer McCabe Responses to Preempts", by = "Robert S. Todd", site = "Advancing in Bridge", url = "https://www.advinbridge.com/this-week-in-bridge/606" },
]

["bidding_conventions/multi_2d"]
name = "Multi 2♦"
source = "proposed"
level = 8
names = ["Multi", "Multi 2♦", "Multi-colored 2♦", "Multi 2D"]
summary = """
An opening 2♦ that shows a weak two in either major, or one of a few strong
hands. Responder bids to cater for either major, and opener's rebid resolves
which.
"""
see = [
  { title = "Multi 2♦", site = "Bridge Bum", url = "https://www.bridgebum.com/multi_2d.php" },
  { title = "25 More Bridge Conventions You Should Know", kind = "book", chapter = 25 },
]

["bidding_conventions/mini_roman_2d"]
name = "Mini-Roman 2♦"
source = "proposed"
level = 7
names = ["Mini-Roman", "Mini Roman", "Roman 2♦", "Mini-Maxi Roman"]
summary = """
An opening 2♦ showing a three-suited hand (4-4-4-1 or 5-4-4-0) of opening
strength; responder bids the cheapest suit to play or 2NT to ask for the
short suit.
"""
see = [
  { title = "Mini-Roman 2♦", site = "ACBL Unit 390", url = "https://www.acblunit390.org/Simon/mini-roman.htm" },
]

["bidding_conventions/flannery"]
name = "Flannery 2♦"
source = "proposed"
level = 6
names = ["Flannery", "Flannery 2♦"]
summary = """
An opening 2♦ showing a minimum opening with five hearts and four spades, so
responder can find a spade fit without opener having to reverse or rebid
awkwardly.
"""
see = [
  { title = "Flannery 2♦", site = "Bridge Bum", url = "https://www.bridgebum.com/flannery_2d.php" },
  { title = "25 More Bridge Conventions You Should Know", kind = "book", chapter = 2 },
]

["bidding_conventions/reverse_flannery"]
name = "Reverse Flannery"
source = "proposed"
level = 8
names = ["Reverse Flannery"]
summary = """
An opening of 2♥ (or 2♦) showing five or more spades and four or more hearts
with less than an opening, a two-suited preempt in the majors.
"""
see = [
  { title = "Reverse Flannery", by = "Robert S. Todd", site = "Advancing in Bridge", url = "https://www.advinbridge.com/this-week-in-bridge/590" },
  { title = "Flannery and Reverse Flannery", site = "Dural Bridge", url = "http://www.duralbridge.com/flannery.ing.htm" },
]

["bidding_conventions/benjamin_2d"]
name = "Benjamin 2♦"
source = "proposed"
level = 8
names = ["Benjamin", "Benjamin twos", "Benjamin 2♦"]
summary = """
Openings in which 2♣ shows a strong two in any suit, 2♦ is the game-forcing
hand, and 2♥ and 2♠ are weak twos, so there is no weak 2♦.
"""
see = [
  { title = "Benjamin Twos", site = "Wikipedia", url = "https://en.wikipedia.org/wiki/Benjamin_Twos" },
]

["bidding_conventions/french_2d"]
name = "French 2♦"
source = "proposed"
level = 8
names = ["French 2♦"]
summary = """
An opening 2♦ with an artificial meaning in the French style; details vary
by partnership, so the card's notes say which.
"""

["bidding_conventions/precision_2d"]
name = "Precision 2♦"
source = "proposed"
level = 7
names = ["Precision 2♦"]
summary = """
In Precision, an opening 2♦ shows a limited opening short in diamonds,
usually 4-4-1-4 or 4-4-0-5 with 11-15 points.
"""

["bidding_conventions/polish_two_suiters"]
name = "Polish two-suiters"
source = "proposed"
level = 9
names = ["Polish two-suiters", "Polish 2♥/2♠"]
summary = """
Weak openings at the two level that show two-suited hands, with the second
suit unknown or limited, as used in Polish Club.
"""

["bidding_conventions/wilkosz"]
name = "Wilkosz 2♦"
source = "proposed"
level = 9
names = ["Wilkosz"]
summary = """
An opening 2♦ showing a weak two-suited hand with at least five cards in
each of two suits, one of them a major.
"""

["bidding_conventions/namyats"]
name = "Namyats"
source = "proposed"
level = 6
names = ["Namyats", "4♣/4♦ transfer to 4♥/4♠", "South African Texas"]
summary = """
Openings of 4♣ and 4♦ show a strong four-level preempt in hearts and spades
respectively, so a direct 4♥ or 4♠ opening is weaker.
"""
see = [
  { title = "25 More Bridge Conventions You Should Know", kind = "book", chapter = 8 },
]

["bidding_conventions/kickback"]
name = "Kickback"
source = "proposed"
level = 9
names = ["Kickback", "Kickback keycard", "Redwood"]
summary = """
A keycard ask in the suit above trumps instead of 4NT: 4♦ with clubs as
trumps, 4♥ with diamonds, 4♠ with hearts, and 4NT with spades. The answers
then never take the auction past five of the trump suit.
"""
see = [
  { title = "Kickback Keycard Ask", by = "Robert S. Todd", site = "Advancing in Bridge", url = "https://www.advinbridge.com/this-week-in-bridge/582" },
]

["bidding_conventions/minorwood"]
name = "Minorwood"
source = "proposed"
level = 7
names = ["Minorwood", "4m keycard", "Crosswood"]
summary = """
With a minor agreed, four of that minor asks for keycards instead of 4NT,
keeping the answers low enough to stop in five of the minor.
"""
see = [
  { title = "Slam Bidding: Minorwood", by = "Robert S. Todd", site = "Advancing in Bridge", url = "https://www.advinbridge.com/this-week-in-bridge/405" },
]

["bidding_conventions/exclusion_blackwood"]
name = "Exclusion Blackwood"
source = "proposed"
level = 7
names = ["Exclusion Blackwood", "Exclusion", "Exclusion RKC", "Voidwood"]
summary = """
A jump to the five level in a new suit after agreeing trumps shows a void
