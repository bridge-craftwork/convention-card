name = "Reverse Drury"
source = "taxonomy"
level = 5
names = ["Reverse Drury", "Drury"]
summary = """
By a passed hand over partner's third- or fourth-seat 1♥ or 1♠, 2♣ shows a
limit raise with three or more trumps. Opener rebids two of the major with a
light opening; other bids show a full one.
"""
see = [
  { title = "25 Bridge Conventions You Should Know", kind = "book", chapter = 12 },
  { title = "Fits and More: 2-Way Reverse Drury", by = "Robert S. Todd", site = "Advancing in Bridge", url = "https://www.advinbridge.com/this-week-in-bridge/525" },
