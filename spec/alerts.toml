# Ogust
[[alert]]
fields = ["two_level.ogust.play"]
call = "2NT"
after = "2♦/2♥/2♠"
by = "responder"
rule = "alert"
acbl = "none"
note = "Asking bid. The ACBL exempts any forcing 2NT over a two-level preempt; the EBU and WBF alert it."

[[alert]]
fields = ["two_level.ogust.play"]
call = "3♣/3♦/3♥/3♠"
after = "2x–2NT"
