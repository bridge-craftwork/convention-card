# Strong 2♣
[[alert]]
fields = ["two_level.two_clubs.meaning"]
call = "2♣"
after = "opening"
by = "opener"
rule = "alert"
acbl = "none"
note = "Artificial strong opening. The ACBL exempts a very strong 2♣ (alert one that may be merely strong); the EBU and WBF alert it."

[[alert]]
fields = ["two_level.two_clubs.meaning"]
call = "2♦"
after = "2♣"
by = "responder"
rule = "alert"
acbl = "none"
note = "Waiting or negative reply. Exempt in the ACBL; alerted in the EBU and WBF."

[[alert]]
fields = ["two_level.two_clubs.meaning"]
call = "2♥/2♠ (natural)"
after = "2♣"
by = "responder"
rule = "none"
note = "Natural positive reply."

[[alert]]
fields = ["two_level.two_clubs.meaning"]
call = "2NT"
after = "2♣–2♦"
by = "opener"
rule = "none"
note = "Natural balanced rebid."

# Weak 2♦
[[alert]]
fields = ["two_level.two_diamonds.meaning"]
call = "2♦"
after = "opening"
by = "opener"
rule = "none"
ebu = "announce"
note = "Natural weak two. The EBU announces the strength (\"Weak\"); the ACBL and WBF do not alert it."

[[alert]]
fields = ["two_level.two_diamonds.meaning"]
call = "New suit (non-forcing)"
when = "a new-suit response is not forcing"
after = "2♦"
by = "responder"
rule = "alert"
note = "Alerted when a new-suit response is not forcing. The EBU and WBF do not cover it directly; an unexpected meaning is alertable under both."

[[alert]]
fields = ["two_level.two_diamonds.meaning"]
call = "Raise (invitational or forcing)"
when = "a raise is invitational or forcing, not preemptive"
after = "2♦"
by = "responder"
rule = "alert"
note = "Alerted in the ACBL when a raise is not preemptive. The EBU and WBF do not cover it; this follows the ACBL."

