fields = ["competitive.dont.play"]
call = "2♣ relay / next step"
after = "(1NT)–X or 2x"
by = "advancer"
rule = "alert"
note = "Relay or pass-or-correct bid."

# Cue-bid raise
[[alert]]
fields = ["competitive.cue_bid_raise.play"]
call = "Cuebid"
after = "1x–(overcall)"
by = "responder"
rule = "alert"
acbl = "none"
note = "Limit raise or better. Exempt in the ACBL after an opening and overcall; the EBU and WBF alert it."

[[alert]]
fields = ["competitive.cue_bid_raise.play"]
call = "Cuebid"
after = "(1x)–overcall–(P)"
by = "advancer"
rule = "alert"
acbl = "none"
note = "Raise of the overcall, limit or better. Exempt in the ACBL; alerted in the EBU, and by the WBF's rule for artificial calls."

# Lead-directing doubles
[[alert]]
fields = ["competitive.lead_directing_double.play"]
call = "X (asks for that suit)"
after = "artificial bid"
by = "either"
rule = "none"
wbf = "alert"
note = "Double of an artificial bid asking for that suit. Not alerted in the ACBL or EBU; the WBF alerts it."

[[alert]]
fields = ["competitive.lead_directing_double.play"]
call = "X (asks for another lead)"
after = "artificial bid"
by = "either"
rule = "alert"
note = "Double of an artificial bid asking for a different lead or against that suit."

[[alert]]
fields = ["competitive.lead_directing_double.play"]
call = "X"
after = "3NT or slam"
by = "either"
rule = "alert"
acbl = "none"
note = "Lead-directing double such as Lightner. The ACBL does not alert doubles of 3NT or higher; the EBU alerts the lead message even above 3NT, and so does the WBF's special-meaning rule."

# Lebensohl (over weak twos)
[[alert]]
fields = ["competitive.lebensohl_weak_twos.play"]
call = "2NT"
after = "(2x)–X–(P)"
by = "advancer"
rule = "alert"
note = "Relay to 3♣ (ACBL uncertain: its forcing-2NT exemption may reach advancer)."

[[alert]]
fields = ["competitive.lebensohl_weak_twos.play"]
call = "3♣"
after = "(2x)–X–(P)–2NT"
by = "overcaller"
rule = "alert"
note = "Forced completion of the relay."

[[alert]]
fields = ["competitive.lebensohl_weak_twos.play"]
call = "Cuebid"
after = "(2x)–X–(P)"
by = "advancer"
rule = "alert"
note = "Artificial cuebid by advancer (ACBL uncertain); not listed by the EBU or WBF, but artificial."

# Sandwich NT
[[alert]]
fields = ["competitive.sandwich_nt.play"]
call = "1NT"
after = "(1x)–P–(1y)"
by = "overcaller"
rule = "alert"
note = "Shows the two unbid suits, not a notrump hand."

# Snapdragon doubles
[[alert]]
fields = ["competitive.snapdragon.play"]
call = "X"
after = "(1x)–1y–(1z)"
by = "advancer"
rule = "alert"
acbl = "announce"
note = "Shows the fourth suit with tolerance for partner. The ACBL announces the suit (uncertain); the EBU (uncertain) and WBF alert it."

# Maximal doubles
[[alert]]
fields = ["doubles.maximal"]
call = "X"
after = "1M–(2x)–2M–(3x)"
by = "opener"
rule = "alert"
acbl = "none"
note = "Game try, not penalty. The ACBL exempts all doubles from opener's rebid on; the EBU and WBF alert it."

# Unusual vs Unusual
[[alert]]
fields = ["competitive.unusual_vs_unusual.play"]
call = "3♣/3♦"
after = "1M–(2NT)"
by = "responder"
rule = "alert"
acbl = "none"
note = "Cuebids of the shown suits. Exempt in the ACBL as raises or good hands; the EBU and WBF alert them."

[[alert]]
fields = ["competitive.unusual_vs_unusual.play"]
call = "X"
after = "1x–(2NT)"
by = "responder"
rule = "none"
wbf = "alert"
note = "Shows values or penalty interest. Exempt in the ACBL and not listed by the EBU (uncertain); the WBF alerts it."

[[alert]]
fields = ["competitive.unusual_vs_unusual.play"]
call = "3 of other major"
after = "1M–(2NT)"
by = "responder"
rule = "alert"
ebu = "announce"
note = "Natural and non-forcing. The ACBL and WBF alert a non-forcing new suit by an unpassed hand; the EBU's \"natural, non-forcing\" announcement fits it."

# Leaping Michaels
[[alert]]
fields = ["competitive.leaping_michaels.play"]
call = "4♣/4♦"
after = "(2♥/2♠)"
by = "overcaller"
rule = "alert"
note = "The minor plus the other major; a direct overcall, so not delayed."

[[alert]]
fields = ["competitive.leaping_michaels.play"]
call = "4 of their suit"
after = "(2♥/2♠)"
by = "overcaller"
rule = "alert"
acbl = "none"
note = "Cuebid of the weak two. Exempt in the ACBL; the EBU (first-round artificial bid) and WBF alert it."

[[alert]]
fields = ["competitive.leaping_michaels.play"]
call = "4♥/4♠"
after = "(2♦)"
by = "overcaller"
rule = "alert"
note = "Two-suited jump over a weak 2♦. The ACBL does not mention it; it alerts natural bids that also show another suit."

# Fourth suit forcing (1 round)
[[alert]]
fields = ["other_conventions.fourth_suit_forcing.one_round"]
call = "Fourth suit"
after = "1x–1y–1z"
by = "responder"
rule = "alert"
note = "Artificial and forcing (one round); does not promise the suit."

[[alert]]
fields = ["other_conventions.fourth_suit_forcing.one_round"]
call = "Opener's rebids"
after = "1x–1y–1z–4th suit"
by = "opener"
rule = "none"
note = "Natural rebids: raise, notrump with a stopper, preference."

# Fourth suit forcing (game force)
[[alert]]
fields = ["other_conventions.fourth_suit_forcing.game_force"]
call = "Fourth suit"
after = "1x–1y–1z"
by = "responder"
rule = "alert"
note = "Artificial and forcing (game force); does not promise the suit."

[[alert]]
fields = ["other_conventions.fourth_suit_forcing.game_force"]
call = "Opener's rebids"
after = "1x–1y–1z–4th suit"
by = "opener"
rule = "none"
note = "Natural rebids: raise, notrump with a stopper, preference."

# Help suit game tries
[[alert]]
fields = ["other_conventions.help_suit_game_tries.play"]
call = "New suit"
after = "1M–2M"
by = "opener"
rule = "none"
note = "Natural try promising three or more cards in the suit (WBF uncertain)."

[[alert]]
fields = ["other_conventions.help_suit_game_tries.play"]
call = "New suit (may be short)"
when = "the try may be a doubleton or shorter"
after = "1M–2M"
by = "opener"
rule = "alert"
note = "A try that may be a doubleton or shorter."

# Reverse bids
[[alert]]
fields = ["other_conventions.reverse_bids.forcing"]
call = "Reverse"
after = "1x–1y"
by = "opener"
rule = "none"
note = "Natural; the extra strength is standard."

# New minor forcing
[[alert]]
fields = ["other_conventions.new_minor_forcing.play"]
call = "2♣/2♦ (other minor)"
after = "1m–1M–1NT"
by = "responder"
rule = "alert"
note = "Artificial forcing enquiry."

[[alert]]
fields = ["other_conventions.new_minor_forcing.play"]
call = "Opener's replies"
after = "1m–1M–1NT–2m"
by = "opener"
rule = "none"
note = "Natural replies; an artificial reply is alerted."

# 2-Way new minor forcing
[[alert]]
fields = ["other_conventions.two_way_nmf"]
call = "2♣"
after = "1x–1y–1NT"
by = "responder"
rule = "alert"
note = "Relay to 2♦."

[[alert]]
fields = ["other_conventions.two_way_nmf"]
call = "2♦"
after = "1x–1y–1NT"
by = "responder"
rule = "alert"
note = "Artificial game force."

[[alert]]
fields = ["other_conventions.two_way_nmf"]
call = "2♦ (forced)"
after = "1x–1y–1NT–2♣"
by = "opener"
rule = "alert"
note = "Forced completion of the relay."

# XYZ
[[alert]]
fields = ["other_conventions.xyz"]
call = "2♣"
after = "1x–1y–1z"
by = "responder"
rule = "alert"
note = "Relay to 2♦ (also after a 1NT rebid)."

[[alert]]
fields = ["other_conventions.xyz"]
call = "2♦"
after = "1x–1y–1z"
by = "responder"
rule = "alert"
note = "Artificial game force."

[[alert]]
fields = ["other_conventions.xyz"]
call = "2♦ (forced)"
after = "1x–1y–1z–2♣"
by = "opener"
rule = "alert"
note = "Forced completion of the relay."

# SOS redouble
[[alert]]
fields = ["other_conventions.sos_redouble.play"]
call = "XX"
after = "balancing double"
by = "either"
rule = "alert"
acbl = "none"
note = "Asks partner to pick another suit. Exempt in the ACBL in the balancing seat or after a balancing double; the EBU and WBF alert it."

[[alert]]
fields = ["other_conventions.sos_redouble.play"]
call = "XX"
after = "direct penalty double"
by = "either"
rule = "alert"
note = "Asks partner to pick another suit."

# Ingberman 2NT
[[alert]]
fields = ["other_conventions.ingberman_2nt.play"]
call = "2NT"
after = "opener's reverse"
by = "responder"
rule = "alert"
note = "Artificial relay or enquiry, not a natural notrump."

[[alert]]
fields = ["other_conventions.ingberman_2nt.play"]
call = "3♣ (forced)"
after = "reverse–2NT"
by = "opener"
rule = "alert"
note = "Forced or coded reply to the relay."

# 1NT opening range
[[alert]]
fields = ["notrump.one_nt.range_min"]
call = "1NT"
after = "opening"
by = "opener"
rule = "announce"
wbf = "none"
note = "Partner states the range (\"15 to 17\") in the ACBL and EBU. The WBF does not alert a natural notrump opening of any range."

# 2NT opening range
[[alert]]
fields = ["notrump.two_nt.range_min"]
call = "2NT"
after = "opening"
by = "opener"
rule = "none"
note = "Natural; only the 1NT range is announced."

# 1♣ that may be short
[[alert]]
fields = ["minor_openings.one_club.min_length"]
call = "1♣"
after = "opening"
by = "opener"
rule = "announce"
wbf = "alert"
note = "Partner announces the minimum length (\"Could be two\"). The WBF has no rule for it but alerts a 1♣ that may be short (uncertain)."

# 1♦ that may be short
[[alert]]
fields = ["minor_openings.one_diamond.min_length"]
call = "1♦"
after = "opening"
by = "opener"
rule = "announce"
wbf = "alert"
note = "Partner announces the minimum length. The WBF alerts a 1♦ that can hold fewer than three cards as artificial."

# Strong artificial 1♣
[[alert]]
fields = ["minor_openings.one_club.art_forcing"]
call = "1♣"
after = "opening"
by = "opener"
rule = "alert"
note = "Strong, forcing, artificial 1♣; the ACBL also wants a pre-alert."

# Natural 2♣ opening
[[alert]]
fields = ["two_level.two_clubs.meaning"]
call = "2♣ (natural)"
when = "the 2♣ opening is natural"
after = "opening"
by = "opener"
rule = "alert"
ebu = "announce"
wbf = "none"
note = "When 2♣ is natural. The ACBL alerts any natural 2♣; the EBU announces its strength band; the WBF does not alert a natural opening."

# Weak twos that may be 12+ HCP
[[alert]]
fields = ["two_level.two_diamonds.max_hcp", "two_level.two_hearts.max_hcp", "two_level.two_spades.max_hcp"]
call = "2♦/2♥/2♠"
after = "opening"
by = "opener"
rule = "alert"
ebu = "announce"
wbf = "none"
note = "A natural two-level opening that may hold 12+ HCP (not 4th seat). The ACBL alerts it; the EBU announces the band (\"Intermediate\"); the WBF does not cover it, and natural openings are not alerted."

# Gambling 3NT
[[alert]]
fields = ["notrump.three_nt.one_suit"]
call = "3NT"
after = "opening"
by = "opener"
rule = "alert"
note = "Based on a long running suit, not a natural notrump. The WBF does not list it; it is not natural, so it is alerted."

# Namyats / 4♣–4♦ transfer preempts
[[alert]]
fields = ["preempts.namyats.play", "preempts.transfer_4_minor"]
call = "4♣/4♦"
after = "opening"
by = "opener"
rule = "alert"
acbl = "announce"
note = "Transfer to a major. The ACBL announces the suit shown (and wants a pre-alert); the EBU and WBF alert it."

# 1NT overcall range
[[alert]]
fields = ["nt_overcalls.direct.range_min"]
call = "1NT"
after = "(1x)"
by = "overcaller"
rule = "none"
note = "Natural 1NT overcall in the usual range."

[[alert]]
fields = ["nt_overcalls.direct.range_min"]
call = "1NT (may be weak)"
when = "the 1NT overcall may be weak"
after = "(1x)"
by = "overcaller"
rule = "alert"
note = "Alerted in the ACBL below 14 HCP and in the EBU when well under 15. The WBF does not cover it; this follows the ACBL."

# Jump overcalls
[[alert]]
fields = ["overcalls.jump"]
call = "Jump overcall (weak)"
after = "(1x)"
by = "overcaller"
rule = "none"
note = "A weak jump overcall is natural and expected, treated like a weak two opening: no regulator alerts it."

[[alert]]
fields = ["overcalls.jump"]
call = "Jump overcall (intermediate or strong)"
when = "jump overcalls are intermediate or strong, not weak"
after = "(1x)"
by = "overcaller"
rule = "alert"
note = "Natural but not weak, so not what opponents expect: the ACBL and the EBU alert it; the WBF does not cover it, so this follows the ACBL."

# Natural cuebid overcall
[[alert]]
fields = ["direct_cuebids.nat_minors_natural", "direct_cuebids.nat_majors_natural"]
call = "2 of their suit (natural)"
after = "(1x)"
by = "overcaller"
rule = "alert"
note = "A natural cuebid of a natural one-level opening. The ACBL alerts it; the EBU and WBF do not list it, but a natural cuebid is unexpected."

# Invitational jump raise
[[alert]]
fields = ["major_openings.jump_raise.inv"]
call = "3♥/3♠"
after = "1♥/1♠"
by = "responder"
rule = "none"
note = "Invitational double raise: natural and expected."

# Weak jump raise
[[alert]]
fields = ["major_openings.jump_raise.weak"]
call = "3♥/3♠"
after = "1♥/1♠"
by = "responder"
rule = "alert"
wbf = "none"
note = "Preemptive jump raise, alerted in the ACBL and EBU when the next hand passed. The WBF reads a raise as natural (uncertain)."

# Weak jump shifts
[[alert]]
fields = ["general.jump_shifts.weak_2", "general.jump_shifts.weak_3", "other_conventions.weak_jump_shifts_not_in_comp"]
call = "Jump shift (weak)"
after = "1x"
by = "responder"
rule = "alert"
ebu = "announce"
note = "A weak jump shift by responder with no interference. Strong is the default, so the ACBL and the WBF alert the weak version; the EBU announces it as natural and non-forcing. Not to be read as a preempt like a weak two or a weak jump overcall."

[[alert]]
fields = ["other_conventions.weak_jump_shifts_in_comp"]
call = "Jump shift (weak)"
after = "1x–(X or overcall)"
by = "responder"
rule = "none"
wbf = "alert"
note = "After a double or an overcall the weak jump shift is standard: no alert in the ACBL, and none in the EBU (uncertain). The WBF alerts every non-forcing jump shift."

# Strong jump shifts
[[alert]]
fields = ["general.jump_shifts.strong_2", "general.jump_shifts.strong_3"]
call = "Jump shift (strong)"
after = "1x"
by = "responder"
rule = "none"
ebu = "announce"
note = "Natural and forcing. The EBU announces \"natural, game-forcing\"; the ACBL and WBF do not alert it."

# Control bids
[[alert]]
fields = ["slam.cue_bids.play"]
call = "Control bid"
after = "suit agreed"
by = "either"
rule = "delayed"
ebu = "none"
wbf = "alert"
note = "Shows a control in the suit bid. The ACBL always delays it; the EBU does not alert it above 3NT after the first round (it does below); the WBF alerts it."
