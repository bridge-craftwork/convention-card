by = "responder"
rule = "announce"
wbf = "alert"
note = "Partner announces \"Semi-forcing\" in the ACBL and the upper limit (\"Up to 12\") in the EBU. The WBF alerts it as a special understanding (uncertain)."

[[alert]]
fields = ["major_openings.one_nt_response.semi_forcing"]
call = "1NT"
after = "1♥/1♠ (3rd/4th seat)"
by = "responder"
rule = "none"
ebu = "announce"
wbf = "alert"
note = "Not announced in the ACBL after a third- or fourth-seat opening. The EBU has no seat rule, so the announcement still applies; the WBF alerts it (uncertain)."

[[alert]]
fields = ["major_openings.one_nt_response.semi_forcing"]
call = "2♣/2♦ (three cards)"
after = "1M–1NT"
by = "opener"
rule = "none"
wbf = "alert"
note = "Rebid in a three-card minor: natural in the ACBL and EBU. The WBF alerts a rebid that may be that short."

[[alert]]
fields = ["major_openings.one_nt_response.semi_forcing"]
call = "2♣/2♦ (may be two)"
when = "opener's minor may be a doubleton"
after = "1M–1NT"
by = "opener"
rule = "alert"
note = "Rebid in a minor that may be a doubleton is not natural (EBU uncertain)."

