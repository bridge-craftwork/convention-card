note = "Coded replies about strength and suit quality."

[[alert]]
fields = ["two_level.ogust.play"]
call = "3NT"
after = "2x–2NT"
by = "opener"
rule = "alert"
acbl = "delayed"
note = "Coded reply (such as a solid suit). The ACBL delays the alert as a 3NT call on opener's rebid."

# Multi 2♦
[[alert]]
fields = ["two_level.two_diamonds.multi"]
call = "2♦"
after = "opening"
by = "opener"
rule = "alert"
note = "Weak two in an unknown major or other options; also pre-alerted in the ACBL."

