call = "2NT"
after = "2♦"
by = "responder"
rule = "alert"
acbl = "none"
note = "Enquiry. The ACBL exempts a forcing 2NT over a two-level preempt (uncertain, as Multi may hold strong hands); the EBU and WBF alert it."

[[alert]]
fields = ["two_level.two_diamonds.multi"]
call = "3-level replies"
after = "2♦–2NT"
by = "opener"
rule = "alert"
note = "Coded replies to the enquiry."

