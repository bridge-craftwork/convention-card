[[alert]]
fields = ["two_level.two_clubs.kokish"]
call = "3♥ (natural)"
after = "2♣–2♦–2♥–2♠"
by = "opener"
rule = "none"
note = "Natural heart rebid after the relay (EBU uncertain)."

