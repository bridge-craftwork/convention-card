# Which calls need an alert or an announcement, by card field, and where
# regulators differ (DESIGN.md, "Alerts").
#
# An entry names the card field(s) it belongs to, the call, the auction it
# comes after and who makes it, and a `rule`:
#
#   alert      alerted at the time it is made
#   announce   the partner of the player who made it says what it is
#              ("transfer", "15 to 17"), instead of alerting
#   delayed    not alerted at the time; explained after the auction
#              (high-level conventional calls after the opening round)
#   none       not alerted
#
# `when` marks a variant: the entry applies only if the partnership plays
# it that way ("the 2♣ response may hold fewer than three clubs"). The
# editor lists such entries but leaves them out of a row's badge.
#
# `rule` is what most of the regulators below do. A regulator that differs
# gets its own key (`ebu = "announce"`), and only then: the build refuses a
# regulator key that repeats the rule. A field with no entry has no calls
# that need alerting, as far as the spec knows.
#
# These are our reading of each regulator's document (cited below), written
# in our own words; they are a guide for a card, not a ruling.

[regulators.acbl]
name = "ACBL"
summary = """
Natural calls are not alerted and artificial calls are, apart from a list of exemptions such as Stayman, 4NT ace asks and a very strong 2♣. A few calls are announced instead: the 1NT opening range, a minor opening that may be short, transfers and other bids showing one named suit, and a forcing or semi-forcing 1NT response. A conventional call at 3NT or higher from opener's rebid on, and any control bid, gets a delayed alert after the auction; passes, doubles and redoubles are never delayed."""
source = { title = "ACBL Alert Procedure", version = "Effective February 16, 2026 (PDF titled \"Alert Procedures Update February 2026\"; supersedes April 15, 2024 and January 1, 2021 editions)", url = "https://web2.acbl.org/documentLibrary/play/Alert-Procedures.pdf" }

[regulators.ebu]
name = "EBU"
summary = """
The bidder's partner alerts any call that is not natural, or natural with a meaning the opponents would not expect. On the first round a fixed set of calls is announced instead, among them the 1NT range, short minors, natural two-level openings, Stayman and transfers. Above 3NT after the first round nothing is alerted except artificial first-round suit bids and some doubles and passes, and there is no delayed alert."""
source = { title = "EBU Blue Book: EBU Player Handbook (chapter 4, Alerting and Announcing)", version = "Revised 2024, effective 1 August 2024 (current edition per ebu.co.uk/blue-book as of Oct 2026)", url = "https://www.ebu.co.uk/documents/laws-and-ethics/blue-book/blue-book.pdf" }

[regulators.wbf]
name = "WBF"
summary = """
Artificial calls, and any call resting on a special partnership understanding, are alerted; natural calls are not. There are no announcements, no delayed alerts and no level cut-off, so conventional calls at the four level and above are alerted too. Non-forcing new-suit and jump-shift responses must be alerted, and behind screens each player alerts both their own calls and partner's."""
source = { title = "WBF Alerting Policy", version = "Adopted July 1997, revised August 2002 and August 2022; published by the WBF Systems Committee March 2023. Screen procedure from WBF General Conditions of Contest §16 and §33.2 (2022) and 'Using Bidding Boxes with Screens' §2.2 (February 2024)", url = "https://championships.worldbridge.org/wp-content/uploads/2024/01/WBFAlertingPolicy.pdf" }

# Stayman
[[alert]]
fields = ["notrump.stayman.forcing"]
call = "2♣"
after = "1NT"
by = "responder"
rule = "none"
ebu = "announce"
wbf = "alert"
note = "Asks for a four-card major. Exempt from alerting in the ACBL; the EBU announces it as \"Stayman\" and the WBF alerts it as artificial."

[[alert]]
fields = ["notrump.stayman.forcing"]
call = "3♣"
after = "2NT"
by = "responder"
rule = "none"
ebu = "announce"
wbf = "alert"
note = "Stayman over 2NT, treated like 2♣ over 1NT: exempt in the ACBL, announced in the EBU. The WBF does not list it; it alerts every artificial call."

[[alert]]
fields = ["notrump.stayman.forcing"]
call = "2♦"
after = "1NT–2♣"
by = "opener"
rule = "none"
wbf = "alert"
note = "Denies a four-card major. Exempt in the ACBL and EBU; the WBF alerts it as artificial."

[[alert]]
fields = ["notrump.stayman.forcing"]
call = "2♥/2♠"
after = "1NT–2♣"
by = "opener"
rule = "none"
note = "Natural major reply. The EBU alerts a 2♠ that does not deny four hearts."

[[alert]]
fields = ["notrump.stayman.forcing"]
call = "2NT/3NT"
after = "1NT–2♣–reply"
by = "responder"
rule = "none"
ebu = "alert"
note = "Natural notrump rebid. The EBU alerts it when the 2♣ did not promise a major; the ACBL and WBF do not mention it and it reads as natural."

# Jacoby transfers
[[alert]]
fields = ["notrump.transfers.jacoby"]
call = "2♦/2♥"
after = "1NT"
by = "responder"
rule = "announce"
wbf = "alert"
note = "Transfer to the next suit up: partner names the suit (\"Hearts\", \"Spades\") in the ACBL and EBU. The WBF has no announcements and alerts it."

[[alert]]
fields = ["notrump.transfers.jacoby"]
call = "3♦/3♥"
after = "2NT"
by = "responder"
rule = "announce"
wbf = "alert"
note = "Transfer over a 2NT opening, announced like the 1NT ones. The WBF alerts it as artificial."

[[alert]]
fields = ["notrump.transfers.jacoby"]
call = "2♥/2♠"
after = "1NT–2♦/2♥"
by = "opener"
rule = "none"
wbf = "alert"
note = "Plain completion of the transfer. The WBF alerts it as a call resting on a partnership understanding."

[[alert]]
fields = ["notrump.transfers.jacoby"]
call = "3♥/3♠"
after = "1NT–2♦/2♥"
by = "opener"
rule = "alert"
acbl = "none"
note = "Super-accept: a jump completion promising four-card support. The EBU and WBF alert the specific holding; the ACBL does not mention it and it reads as a natural raise."

[[alert]]
fields = ["notrump.transfers.jacoby"]
call = "3♥"
when = "responder's rebid has an agreed artificial meaning"
after = "1NT–2♥–2♠"
by = "responder"
rule = "alert"
note = "Alerted only when responder's rebid carries an agreed artificial meaning (for example a game force with long spades); a natural second suit is not."

# Texas transfers
[[alert]]
fields = ["notrump.transfers.texas"]
call = "4♦/4♥"
after = "1NT"
by = "responder"
rule = "announce"
wbf = "alert"
note = "Four-level transfer to a major, announced by naming the suit even above 3NT. The WBF alerts it as artificial."

[[alert]]
fields = ["notrump.transfers.texas"]
call = "4♥/4♠"
after = "1NT–4♦/4♥"
by = "opener"
rule = "none"
wbf = "alert"
note = "Completion of the transfer. The WBF alerts it as a call based on an understanding."

# Smolen
[[alert]]
fields = ["notrump.smolen.play"]
call = "3♥/3♠"
after = "1NT–2♣–2♦"
by = "responder"
rule = "alert"
note = "Shows four cards in the major bid and five in the other."

[[alert]]
fields = ["notrump.smolen.play"]
call = "3NT/4♥/4♠"
after = "1NT–2♣–2♦–3♥/3♠"
by = "opener"
rule = "none"
note = "Natural choice of game. The WBF does not mention it; natural calls are not alerted there."

# Puppet Stayman
[[alert]]
fields = ["notrump.stayman.puppet_1nt"]
call = "2♣"
after = "1NT"
by = "responder"
rule = "alert"
acbl = "none"
note = "Puppet Stayman over 1NT. The ACBL exempts any major-suit ask over notrump; the EBU alerts Puppet rather than announcing it, and the WBF alerts it as artificial."

[[alert]]
fields = ["notrump.stayman.puppet_1nt"]
call = "3♣"
after = "2NT"
by = "responder"
rule = "alert"
acbl = "none"
note = "Asks for a four- or five-card major. Exempt in the ACBL as a major-suit ask; alerted in the EBU and WBF."

[[alert]]
fields = ["notrump.stayman.puppet_1nt"]
call = "3♦"
after = "2NT–3♣"
by = "opener"
rule = "alert"
note = "Shows at least one four-card major and no five-card major."

[[alert]]
fields = ["notrump.stayman.puppet_1nt"]
call = "3♥/3♠"
after = "2NT–3♣"
by = "opener"
rule = "none"
acbl = "alert"
note = "Shows a five-card major. The ACBL lists it as a natural reply that is still alerted; the EBU treats it as natural, and the WBF does not mention it."

[[alert]]
fields = ["notrump.stayman.puppet_1nt"]
call = "3NT"
after = "2NT–3♣"
by = "opener"
rule = "none"
note = "Natural: no four- or five-card major."

[[alert]]
fields = ["notrump.stayman.puppet_1nt"]
call = "3♥/3♠"
after = "2NT–3♣–3♦"
by = "responder"
rule = "alert"
acbl = "announce"
note = "Responder bids the major he does not hold. The ACBL treats it as a one-suit showing call to announce (uncertain: some directors want an alert); the EBU and WBF alert it."

[[alert]]
fields = ["notrump.stayman.puppet_1nt"]
call = "4♦"
after = "2NT–3♣–3♦"
by = "responder"
rule = "alert"
ebu = "none"
note = "Shows both majors. The EBU does not alert it because it is above 3NT after the first round."

# Lebensohl (over interference)
[[alert]]
fields = ["notrump.lebensohl.over_interference"]
call = "2NT"
after = "1NT–(2x)"
by = "responder"
rule = "alert"
note = "Relay forcing opener to bid 3♣."

[[alert]]
fields = ["notrump.lebensohl.over_interference"]
call = "3♣"
after = "1NT–(2x)–2NT"
by = "opener"
rule = "alert"
note = "Forced completion of the relay."

[[alert]]
fields = ["notrump.lebensohl.over_interference"]
call = "3 of their suit"
after = "1NT–(2x)"
by = "responder"
rule = "alert"
acbl = "none"
note = "Stayman-like cuebid, with the route showing or denying a stopper. The ACBL exempts bids in the overcaller's suit after a notrump opening; the EBU and WBF alert it."

[[alert]]
fields = ["notrump.lebensohl.over_interference"]
call = "3NT"
after = "1NT–(2x)"
by = "responder"
rule = "alert"
acbl = "none"
note = "To play, but its route shows or denies a stopper. The ACBL treats it as natural; the EBU alerts the stopper message, and the WBF's rule for special understandings points the same way."

# Garbage Stayman
[[alert]]
fields = ["notrump.stayman.garbage"]
call = "2♣"
after = "1NT"
by = "responder"
rule = "none"
ebu = "announce"
wbf = "alert"
note = "Stayman that may be weak. Still exempt in the ACBL and still announced \"Stayman\" in the EBU; the WBF alerts it as artificial."

[[alert]]
fields = ["notrump.stayman.garbage"]
call = "Pass"
after = "1NT–2♣–2♦/2♥/2♠"
by = "responder"
rule = "none"
note = "Passing opener's reply is natural."

[[alert]]
fields = ["notrump.stayman.garbage"]
call = "2♥"
when = "playing crawling Stayman (2♥ shows both majors, weak)"
after = "1NT–2♣–2♦"
by = "responder"
rule = "alert"
note = "Crawling variant: weak with both majors. The ACBL alerts it; the EBU and WBF do not mention it, but its extra message is alertable under their general rules."

# Two-over-one game force
[[alert]]
fields = ["major_openings.two_over_one.game_force"]
call = "2♣/2♦/2♥"
after = "1♥/1♠"
by = "responder"
rule = "none"
ebu = "announce"
note = "Natural game-forcing new suit (2♥ only over 1♠). The EBU announces it as \"natural, game-forcing\"; the ACBL and WBF do not alert it."

[[alert]]
fields = ["major_openings.two_over_one.game_force"]
call = "2♣ (may be short)"
when = "the 2♣ response may hold fewer than three clubs"
after = "1♥/1♠"
by = "responder"
rule = "alert"
note = "Alerted when the 2♣ response may hold fewer than three clubs, since it is then not natural."

# Jacoby 2NT
[[alert]]
fields = ["major_openings.jacoby_2nt.play"]
call = "2NT"
after = "1♥/1♠"
by = "responder"
rule = "alert"
note = "Artificial game-forcing raise."

[[alert]]
fields = ["major_openings.jacoby_2nt.play"]
call = "3♣/3♦/3 of other major"
after = "1M–2NT"
by = "opener"
rule = "alert"
note = "Shows shortness in the suit bid."

[[alert]]
fields = ["major_openings.jacoby_2nt.play"]
call = "3 of the major"
after = "1M–2NT"
by = "opener"
rule = "alert"
acbl = "none"
note = "Shows extras without shortness. The ACBL reads it as natural; the EBU and WBF alert it as a coded strength message."

[[alert]]
fields = ["major_openings.jacoby_2nt.play"]
call = "3NT"
after = "1M–2NT"
by = "opener"
rule = "alert"
acbl = "delayed"
note = "Coded hand description, not an offer to play. The ACBL gives a delayed alert because it is at 3NT on opener's rebid."

[[alert]]
fields = ["major_openings.jacoby_2nt.play"]
call = "4♣/4♦"
after = "1M–2NT"
by = "opener"
rule = "none"
wbf = "alert"
note = "Shows a good second suit. Natural in the ACBL and above 3NT after the first round in the EBU; the WBF alerts the reply."

[[alert]]
fields = ["major_openings.jacoby_2nt.play"]
call = "4 of the major"
after = "1M–2NT"
by = "opener"
rule = "none"
note = "Minimum sign-off. The WBF does not list it separately; it reads as natural."

# Modified Jacoby 2NT
[[alert]]
fields = ["major_openings.jacoby_2nt.modified"]
call = "2NT"
after = "1♥/1♠"
by = "responder"
rule = "alert"
note = "Artificial game-forcing raise."

[[alert]]
fields = ["major_openings.jacoby_2nt.modified"]
call = "3♣/3♦/3♥/3♠"
after = "1M–2NT"
by = "opener"
rule = "alert"
note = "Step replies showing strength or controls."

[[alert]]
fields = ["major_openings.jacoby_2nt.modified"]
call = "3NT"
after = "1M–2NT"
by = "opener"
rule = "alert"
acbl = "delayed"
note = "Step reply at 3NT. The ACBL delays the alert to the end of the auction."

[[alert]]
fields = ["major_openings.jacoby_2nt.modified"]
call = "4-level steps"
after = "1M–2NT"
by = "opener"
rule = "delayed"
ebu = "none"
wbf = "alert"
note = "Step reply above 3NT. The ACBL gives a delayed alert, the EBU none after the first round; the WBF has no level cut-off."

[[alert]]
fields = ["major_openings.jacoby_2nt.modified"]
call = "Relay asks below 3NT"
after = "1M–2NT–3x"
by = "responder"
rule = "alert"
note = "Responder's artificial follow-up asks (ACBL uncertain: depends on the scheme, and those at 3NT or above are delayed)."

# Bergen raises
[[alert]]
fields = ["major_openings.bergen_raises.play"]
call = "3♣/3♦"
after = "1♥/1♠"
by = "responder"
rule = "alert"
note = "Artificial raises showing four-card support."

[[alert]]
fields = ["major_openings.bergen_raises.play"]
call = "3♥/3♠"
after = "1♥/1♠"
by = "responder"
rule = "alert"
wbf = "none"
note = "Preemptive jump raise, alerted in the ACBL and EBU when the next hand passed. The WBF does not list it and reads a jump raise as natural (uncertain)."

[[alert]]
fields = ["major_openings.bergen_raises.play"]
call = "3♦/3 of other suit"
after = "1M–3♣"
by = "opener"
rule = "alert"
note = "Artificial re-ask or game try after the artificial raise."

# Mixed jump raise
[[alert]]
fields = ["major_openings.jump_raise.mixed"]
call = "3♥/3♠"
after = "1♥/1♠"
by = "responder"
rule = "alert"
wbf = "none"
note = "Jump raise weaker than a limit raise; the ACBL does not alert it after a double. The WBF reads it as a natural raise (uncertain)."

[[alert]]
fields = ["major_openings.jump_raise.mixed"]
call = "Artificial mixed raise"
after = "1♥/1♠"
by = "responder"
rule = "alert"
note = "A mixed raise shown by an artificial bid (such as 3♣). The ACBL does not alert a jump cuebid after an overcall."

# Splinters
[[alert]]
fields = ["major_openings.splinters.play"]
call = "3♠/4♣/4♦/4♥"
after = "1♥/1♠"
by = "responder"
rule = "alert"
note = "Double jump showing shortness. Alerted at once even at the four level, as responder's first call."

[[alert]]
fields = ["major_openings.splinters.play"]
call = "3-level splinter"
after = "1x–1y"
by = "opener"
rule = "alert"
note = "Opener's jump showing shortness below 3NT."

[[alert]]
fields = ["major_openings.splinters.play"]
call = "4-level splinter"
after = "1x–1y"
by = "opener"
rule = "delayed"
ebu = "none"
wbf = "alert"
note = "Opener's splinter above 3NT. The ACBL delays the alert; the EBU does not alert it after the first round; the WBF alerts it."

# Drury
[[alert]]
fields = ["major_openings.drury.play"]
call = "2♣"
after = "P–1♥/1♠"
by = "responder"
rule = "alert"
note = "Artificial raise by a passed hand."

[[alert]]
fields = ["major_openings.drury.play"]
call = "2♦"
after = "P–1M–2♣"
by = "opener"
rule = "alert"
note = "Artificial reply about opener's strength."

[[alert]]
fields = ["major_openings.drury.play"]
call = "2 of the major"
after = "P–1M–2♣"
by = "opener"
rule = "none"
wbf = "alert"
note = "Return to the major. Natural in the ACBL and EBU; the WBF alerts opener's replies as artificial (it groups them, so this is our reading)."

# Reverse Drury
